<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Kit design review</title>
<style>
:root{--bg:#F0F0F0;--surface:#fff;--s2:#F5F5F5;--bd:#E5E5E5;--tx:#1B2230;--tx2:#475467;--tx3:#5F6A7D;--ac:#0069CC;--acs:#DCE9F7;--ok:#1A7F4B;--oks:#DFF5EA;--wn:#B35C00;--wns:#FDF0D5;--er:#C62828;--ers:#FDE4E1;--sh:0 1px 3px #0001,0 6px 16px #0000000d}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.bar{display:flex;gap:16px;align-items:center;padding:12px 24px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tx3);font-size:12.5px}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit}
.pill b{color:var(--tx)}.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.pill.on b{color:var(--bg)}
.btn{border:1px solid var(--bd);background:var(--surface);color:var(--tx);border-radius:9px;padding:6px 12px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--tx3)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
nav.toc{display:flex;gap:6px;padding:0 24px 12px;overflow-x:auto}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--tx2);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid transparent}
nav.toc a:hover{background:var(--s2)}nav.toc a span{color:var(--tx3);font-weight:500;margin-left:4px}
main{padding:8px 0 80px}
section.feat{padding:28px 0 6px}
.fh{padding:0 24px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fh .k{min-width:44px;padding:0 6px;height:34px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800}
.fh h2{margin:0;font-size:20px;letter-spacing:-.01em}.fh p{margin:2px 0 0;color:var(--tx2);max-width:760px}
.fh .grow{flex:1;min-width:260px}
.row{display:flex;gap:18px;overflow-x:auto;padding:16px 24px 18px;scroll-snap-type:x mandatory}
.row::-webkit-scrollbar{height:10px}.row::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.card{flex:0 0 min(1180px,calc(100vw - 48px));scroll-snap-align:center;scroll-snap-align:start;background:var(--surface);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.card[data-s=approved]{border-color:var(--ok)}.card[data-s=change]{border-color:var(--wn)}.card[data-s=rejected]{border-color:var(--er)}
.thumb{aspect-ratio:1440/900;background:var(--s2);display:grid;place-items:center;cursor:zoom-in;border-bottom:1px solid var(--bd);position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.thumb.side{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd)}.thumb.side .pane{position:relative;background:var(--s2);display:grid;place-items:center;overflow:hidden}.thumb.side img{position:static;width:auto;height:auto;max-width:100%;max-height:100%}
.thumb.built{background:#DEDFE3}.thumb.built img{position:static;width:auto;height:auto;max-width:100%;max-height:100%}
.pane i{position:absolute;left:8px;top:6px;font:700 11px Inter,sans-serif;color:var(--tx2);background:#fffc;border-radius:6px;padding:1px 6px;font-style:normal}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 0}.seg button{border:0;background:var(--surface);padding:4px 10px;font:600 12px Inter,sans-serif;color:var(--tx2);cursor:pointer}.seg button.on{background:var(--tx);color:#fff}.seg button:disabled{opacity:.4;cursor:default}
.seg+select{margin-left:8px;font:12px Inter,sans-serif}
.nav{display:flex;gap:6px}.nav .btn{padding:4px 12px}.cnt{color:var(--tx3);font-size:12.5px;align-self:center}
.meta{padding:12px 14px 6px}
.id{display:inline-block;font:700 11px ui-monospace,Consolas,monospace;background:var(--s2);color:var(--tx2);border-radius:6px;padding:2px 7px;margin-right:6px}
.dk{font-size:10.5px;font-weight:700;color:var(--tx3);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:4px}
.card h3{font-size:14.5px;margin:6px 0 2px}.card p{margin:0;color:var(--tx2);font-size:12.5px;min-height:36px}
.acts{display:flex;gap:6px;padding:10px 14px 12px}
.acts button{flex:1;border:1px solid var(--bd);background:var(--surface);color:var(--tx2);border-radius:8px;padding:7px 4px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.acts button:hover{background:var(--s2)}
.card[data-s=approved] .a{background:var(--oks);color:var(--ok);border-color:var(--ok)}
.card[data-s=change] .c{background:var(--wns);color:var(--wn);border-color:var(--wn)}
.card[data-s=rejected] .r{background:var(--ers);color:var(--er);border-color:var(--er)}
textarea{display:none;margin:0 14px 12px;width:calc(100% - 28px);border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);padding:8px;font:13px inherit;font-family:inherit;resize:vertical;min-height:54px}
.card[data-s=change] textarea,.card[data-s=rejected] textarea,textarea.has{display:block}
.hide{display:none!important}
#lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:78vh;border-radius:8px;box-shadow:0 20px 60px #000}
#lb .cap{color:#fff;text-align:center;max-width:900px}#lb .cap b{font-size:16px}#lb .cap div{opacity:.8;font-size:13px}
#lb .ctl{display:flex;gap:8px}#lb .btn{background:#ffffff1f;color:#fff;border-color:#ffffff33}
.hint{color:var(--tx3);font-size:12px}
@media(max-width:700px){.card{flex-basis:86vw}.thumb{height:220px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div><h1>Speak Kit design review</h1><div class="sub"><b>248</b> frames &middot; <b>147</b> with a built screenshot &middot; <b>101</b> design-only &middot; 50 features &middot; click an image to enlarge; viewer keys: &larr; &rarr; move, A approve, C change, R reject, B built</div></div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="copy">Copy summary</button>
    <button class="btn pri" id="export">Export decisions</button>
  </div>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<div id="lb"><img id="lbimg" alt=""><div class="cap"><b id="lbt"></b><div id="lbn"></div></div><div class="ctl"><button class="btn" data-k="prev">\u2190 Prev</button><button class="btn" data-k="a">Approve</button><button class="btn" data-k="c">Change</button><button class="btn" data-k="r">Reject</button><button class="btn" data-k="next">Next \u2192</button><button class="btn" data-k="x">Close</button></div></div>
<script>
const DATA = {"groups":{"1.1":{"name":"Research & feature map: 1 · Feature map","blurb":"what ships in v1 and what waits, per surface"},"1.2":{"name":"Research & feature map: 2 · Flows and resources","blurb":"the three flows that matter, and the engine lifecycle behind them"},"1.3":{"name":"Research & feature map: 3 · Lockix patterns adopted","blurb":"which Lockix frame each Speak Kit surface copies"},"2.1":{"name":"Chrome extension: 1 · Toolbar popup","blurb":"idle, selection, preparing, playing, paused"},"2.2":{"name":"Chrome extension: 2 · Popup pickers and finish","blurb":"voice, speed and the finished state"},"2.3":{"name":"Chrome extension: 3 · Popup engine states","blurb":"unloaded, waking, loading: the engine wakes on play"},"2.4":{"name":"Chrome extension: 4 · Popup connection problems","blurb":"app not running or installed, pairing token, version mismatch"},"2.5":{"name":"Chrome extension: 5 · Popup page problems","blurb":"file URL permission, unreadable page, Chrome PDF viewer"},"2.6":{"name":"Chrome extension: 6 · Read-aloud pill","blurb":"Lumen F5 pill on the page: idle, preparing, reading, paused, finished, error, engine states"},"2.7":{"name":"Chrome extension: 7 · Selecting and starting","blurb":"selection bubble, paragraph gutter, context menu, queue toast, back to current"},"2.8":{"name":"Chrome extension: 8 · Pill popovers and reading settings","blurb":"speed, voice and the Reading popover (Sans, Serif, Dyslexic, size, width, theme, highlight)"},"2.9":{"name":"Chrome extension: 9 · Reader view","blurb":"paper reader at full fidelity, with the pill and the Reading popover"},"2.10":{"name":"Chrome extension: 10 · Edge launcher","blurb":"the 14 px tab at the page edge, the reading tab, the vertical pill on hover, and the dark-site variants"},"2.11":{"name":"Chrome extension: 11 · Options page","blurb":"connection, voice, highlighting, reader view, shortcuts, sites, edge launcher, with their offline, off and empty states"},"2.12":{"name":"Chrome extension: 12 · Pairing and permissions","blurb":"token field and test connection, Open Speak Kit deep link, per-site permissions, shortcut conflict"},"2.13":{"name":"Chrome extension: 13 · Side panel","blurb":"queue and outline, empty queue"},"2.14":{"name":"Chrome extension: 14 · Responsive options page","blurb":"breakpoint rules and the narrow layout below 1025 px"},"3.1":{"name":"Desktop app: 1 · First launch and setup","blurb":"status screen, then the 960x680 setup window with its 5-step stepper"},"3.2":{"name":"Desktop app: 2 · Desktop shell","blurb":"title bar with search and status pill, 248 px sidebar, inset card, command palette, narrow rail"},"3.3":{"name":"Desktop app: 3 · Library","blurb":"readings, adding content, search"},"3.4":{"name":"Desktop app: 4 · Library actions","blurb":"drag and drop, menus, delete, toasts"},"3.5":{"name":"Desktop app: 5 · Reader","blurb":"playing, paused, preparing, finished, read from here"},"3.6":{"name":"Desktop app: 6 · Reader tools","blurb":"outline, display settings, sleep timer, speed and voice, search"},"3.7":{"name":"Desktop app: 7 · PDF reader","blurb":"PDF playing, scanned page, recognition consent, recognizing text, recognition failed"},"3.8":{"name":"Desktop app: 8 · Voices and engines","blurb":"Kokoro library, detail, engine manager and warnings"},"3.9":{"name":"Desktop app: 9 · Voice cloning","blurb":"Chatterbox cloning flow, consent and failures"},"3.10":{"name":"Desktop app: 10 · Settings: general and playback","blurb":"nav 248, search, groups of rows on a 760 px column"},"3.11":{"name":"Desktop app: 11 · Settings: browser and shortcuts","blurb":"paired browsers, port, token, shortcut recording and conflicts"},"3.12":{"name":"Desktop app: 12 · Settings: memory and performance","blurb":"idle unload 1/5/15/never, load at startup, battery saver; storage"},"3.13":{"name":"Desktop app: 13 · Settings: notifications and startup","blurb":"event table, Do not disturb, sign-in start, tray behavior"},"3.14":{"name":"Desktop app: 14 · Updates and about","blurb":"about, update available, update pill and popover, updating card"},"3.15":{"name":"Desktop app: 15 · Engine states","blurb":"Unloaded, Loading, Ready across popup, pill, tray and sidebar"},"3.16":{"name":"Desktop app: 16 · Tray panel and menu","blurb":"left-click panel in every engine state, right-click native menu, on the Windows taskbar"},"3.17":{"name":"Desktop app: 17 · Mini player","blurb":"always-on-top card in the screen corner: playing, paused, preparing, error, finished"},"3.18":{"name":"Desktop app: 18 · Notifications and shortcuts","blurb":"Windows toasts (no buttons)"},"3.19":{"name":"Desktop app: 19 · Export audio","blurb":"options, rendering, background, done"},"3.20":{"name":"Desktop app: 20 · Quit and system states","blurb":"quit confirmation, crashes, resources, permissions, offline"},"3.21":{"name":"Desktop app: 21 · Edge-state and empty-state boards","blurb":"12 edge cases on one board, empty states for every list"},"3.22":{"name":"Desktop app: 22 · Superseded first-run layouts","blurb":"the nine onboarding screens replaced by the setup window"},"4.1":{"name":"Foundations & components: 1 · Tokens","blurb":"color, type, radius, elevation and the Tabler icon set"},"4.2":{"name":"Foundations & components: 2 · Components and states","blurb":"buttons, inputs, selection controls, menus, tags in every state"},"4.3":{"name":"Foundations & components: 3 · Desktop components","blurb":"title bar, sidebar, settings rows, stepper, banners, toasts, storage bar, code boxes"},"4.4":{"name":"Foundations & components: 4 · Extension components","blurb":"pill, Reading popover, bubble, popup header, banners, tooltips"},"4.5":{"name":"Foundations & components: 5 · Elevation and platform radii","blurb":"the Lockix shadows with their radii; Windows 8/10 px against macOS 14/16 px container radii"},"5.1":{"name":"Logo: 1 · Marks","blurb":"primary, small variant and one-colour versions as editable vectors"},"5.2":{"name":"Logo: 2 · Lockups","blurb":"horizontal and stacked with the Speak Kit wordmark, ink and white"},"5.3":{"name":"Logo: 3 · App icons and tray","blurb":"macOS 1024 with 824 body and shadow, Windows .ico sizes, extension toolbar, tray states, menu-bar template"},"5.4":{"name":"Logo: 4 · Construction and rules","blurb":"squircle 22.4 %, one line weight, clear space, minimum sizes, colours, do and don't"},"6.1":{"name":"Motion: 1 · Motion tokens","blurb":"durations 83/167/250/333/120 ms, easing, spring 420/34"},"6.2":{"name":"Motion: 2 · Per-element rules","blurb":"trigger, animation, duration, easing and reduce-motion fallback for 18 elements"}},"screens":[{"id":"R1","group":"1.1","title":"Feature map","note":"Every feature sits on one surface and carries v1 or v1.1; nothing is on two.","tag":"","w":1440,"h":900,"shots":[]},{"id":"R2","group":"1.1","title":"Surfaces","note":"Surfaces stay separate: extension, desktop app, loopback server, engine.","tag":"","w":1440,"h":900,"shots":[]},{"id":"R3","group":"1.2","title":"First read in four steps","note":"First read in four steps: install, pair, play, and the engine wakes by itself.","tag":"","w":1440,"h":900,"shots":[]},{"id":"R4","group":"1.2","title":"Resource lifecycle","note":"The engine unloads when idle and wakes on play; the model never reloads while reading.","tag":"","w":1440,"h":900,"shots":[]},{"id":"R7","group":"1.2","title":"Per-tab behavior","note":"One audio output; the pill, highlight, reader view and popup belong to their own tab, and Close for this tab lasts until reload.","tag":"","w":1440,"h":900,"shots":[]},{"id":"R5","group":"1.3","title":"Lockix patterns adopted","note":"Every Speak Kit surface names the Lockix frame it copies; no new look is invented.","tag":"","w":1440,"h":900,"shots":[]},{"id":"R6","group":"1.3","title":"Decisions that shape the UI","note":"Decisions that shape the UI: local only, no account, no cloud voice.","tag":"","w":1440,"h":900,"shots":[]},{"id":"A1","group":"2.1","title":"Popup · idle on an article","note":"Nothing playing yet.","tag":"","w":1600,"h":1000,"shots":["A1-idle-light.png"]},{"id":"A2","group":"2.1","title":"Popup · selection ready","note":"Text is selected on the page; the popup offers to read only that, with a real time estimate.","tag":"","w":1600,"h":1000,"shots":["A2-selection-light.png"]},{"id":"A3","group":"2.1","title":"Popup · preparing audio","note":"First sentence is being synthesized.","tag":"","w":1600,"h":1000,"shots":["A3-preparing-light.png"]},{"id":"A4","group":"2.1","title":"Popup · playing","note":"Scrubber with time left, 10 s skips, previous/next paragraph.","tag":"","w":1600,"h":1000,"shots":["A4-playing-light.png"]},{"id":"A5","group":"2.1","title":"Popup · paused","note":"Same layout, play button instead of pause.","tag":"","w":1600,"h":1000,"shots":["A5-paused-light.png"]},{"id":"A23","group":"2.1","title":"Popup · playing with a selection on the page","note":"Playback keeps the page title; a selection on the page does not change the player.","tag":"","w":1600,"h":1000,"shots":["A23-playing-selection-light.png"]},{"id":"A6","group":"2.2","title":"Popup · voice picker","note":"Searchable voice list with language, accent and voice filters; every row has a preview button.","tag":"","w":1600,"h":1000,"shots":["A6-voice-picker-light.png"]},{"id":"A7","group":"2.2","title":"Popup · speed picker","note":"Slider with live value plus presets across the 0.5x to 3x range.","tag":"","w":1600,"h":1000,"shots":["A7-speed-picker-light.png"]},{"id":"A8","group":"2.2","title":"Popup · finished","note":"End of page; main button becomes replay and the next queued item is offered.","tag":"","w":1600,"h":1000,"shots":["A8-finished-light.png"]},{"id":"A16","group":"2.3","title":"Popup · engine asleep","note":"Idle unload freed the model; play wakes it, about 2 s.","tag":"","w":1600,"h":1000,"shots":["A16-engine-asleep-light.png"]},{"id":"A17","group":"2.3","title":"Popup · waking the engine","note":"Press play on an unloaded engine: skips disabled, Cancel available.","tag":"","w":1600,"h":1000,"shots":["A17-engine-waking-light.png"]},{"id":"A10","group":"2.3","title":"Popup · model loading","note":"App is up but the voice engine is still starting.","tag":"","w":1600,"h":1000,"shots":["A10-model-loading-light.png"]},{"id":"A21","group":"2.3","title":"Popup · downloading the voice model","note":"The model downloads on first run; the popup shows the progress and Cancel.","tag":"","w":1600,"h":1000,"shots":["A21-engine-downloading-light.png"]},{"id":"A20","group":"2.3","title":"Popup · no voice engine installed","note":"The app runs but the Kokoro model is not installed; open the app to download it.","tag":"","w":1600,"h":1000,"shots":["A20-engine-missing-light.png"]},{"id":"A22","group":"2.3","title":"Popup · voice engine error","note":"The engine failed to start; open the app to repair it.","tag":"","w":1600,"h":1000,"shots":["A22-engine-error-light.png"]},{"id":"A9","group":"2.4","title":"Popup · app not running","note":"The desktop app is closed.","tag":"","w":1600,"h":1000,"shots":["A9-app-not-running-light.png"]},{"id":"A13","group":"2.4","title":"Popup · app not installed","note":"First run: the app is not on this computer yet, so Download is the primary action.","tag":"","w":1600,"h":1000,"shots":["A13-not-installed-light.png"]},{"id":"A14","group":"2.4","title":"Popup · pairing token rejected","note":"App and browser no longer share a token; re-pair from the extension options.","tag":"","w":1600,"h":1000,"shots":["A14-token-rejected-light.png"]},{"id":"A18","group":"2.4","title":"Popup · app and extension versions differ","note":"The protocol versions no longer match; install the latest app, settings are kept.","tag":"","w":1600,"h":1000,"shots":["A18-version-mismatch-light.png"]},{"id":"A15","group":"2.5","title":"Popup · local file needs permission","note":"file:// pages need “Allow access to file URLs” in the extension settings.","tag":"","w":1600,"h":1000,"shots":["A15-file-permission-light.png"]},{"id":"A11","group":"2.5","title":"Popup · page not readable","note":"Chrome internal pages and the Web Store block extensions.","tag":"","w":1600,"h":1000,"shots":["A11-page-unreadable-light.png"]},{"id":"A19","group":"2.5","title":"Popup · Chrome's PDF viewer","note":"Extensions cannot read text inside Chrome's PDF viewer; paste the text into the app.","tag":"","w":1600,"h":1000,"shots":["A19-pdf-light.png"]},{"id":"A24","group":"2.5","title":"Popup · closed in this tab","note":"Closed in this tab: the idle popup adds a Show on this page button.","tag":"","w":1600,"h":1000,"shots":["A24-tab-hidden-light.png"]},{"id":"B4","group":"2.6","title":"Page · pill idle","note":"Pill appears bottom center on first use: play, paragraph count and time, speed, voice, more and a close x for this tab.","tag":"","w":1600,"h":1000,"shots":["B4-pill-idle-light.png"]},{"id":"B5","group":"2.6","title":"Page · pill preparing","note":"Preparing shows a spinner in the play button and a looping bar.","tag":"","w":1600,"h":1000,"shots":["B5-pill-preparing-light.png"]},{"id":"B6","group":"2.6","title":"Page · reading with highlight","note":"Paragraph 2 of 14 · 9 min left, sentence band plus word marker, page follows.","tag":"","w":1600,"h":1000,"shots":["B6-reading-highlight-light.png"]},{"id":"B11","group":"2.6","title":"Page · reading on a dark site","note":"The white pill stays readable over a dark website; the highlight palette adapts to the page.","tag":"","w":1600,"h":1000,"shots":["B11-dark-site-idle-light.png","B11-dark-site-reading-light.png"]},{"id":"B7","group":"2.6","title":"Page · paused","note":"Paused keeps the highlight on the last spoken sentence.","tag":"","w":1600,"h":1000,"shots":["B7-paused-light.png"]},{"id":"B8","group":"2.6","title":"Page · finished","note":"Done replaces the text with Read again.","tag":"","w":1600,"h":1000,"shots":["B8-finished-light.png"]},{"id":"B9","group":"2.6","title":"Page · app offline error","note":"One surface: the pill explains the problem, Open Speak Kit and Retry.","tag":"","w":1600,"h":1000,"shots":["B9-app-offline-light.png"]},{"id":"B22","group":"2.6","title":"Page · pill, engine asleep","note":"The product shows the plain idle pill while the engine is asleep (identical to B4); play...","tag":"","w":1600,"h":1000,"shots":["B22-pill-engine-asleep-light.png"]},{"id":"B23","group":"2.6","title":"Page · pill, waking the engine","note":"Play on an unloaded engine: preparing lasts long enough that the pill says Waking the voice...","tag":"","w":1600,"h":1000,"shots":["B23-pill-engine-waking-light.png"]},{"id":"B25","group":"2.6","title":"Page · pill, token rejected","note":"Pairing token rejected: Settings and Retry.","tag":"","w":1600,"h":1000,"shots":["B25-pill-error-token-light.png"]},{"id":"B26","group":"2.6","title":"Page · pill, engine not ready","note":"The engine is still loading: Retry only.","tag":"","w":1600,"h":1000,"shots":["B26-pill-error-engine-light.png"]},{"id":"B27","group":"2.6","title":"Page · pill, synthesis failed","note":"Speech synthesis failed: Retry.","tag":"","w":1600,"h":1000,"shots":["B27-pill-error-generic-light.png"]},{"id":"B28","group":"2.6","title":"Page · pill, page not readable","note":"The page has nothing readable: no actions.","tag":"","w":1600,"h":1000,"shots":["B28-pill-error-unreadable-light.png"]},{"id":"B35","group":"2.6","title":"Page · pill idle on a dark site","note":"The idle pill over a dark host page.","tag":"","w":1600,"h":1000,"shots":[]},{"id":"B38","group":"2.6","title":"Page · closed for this tab","note":"Close for this tab stops reading and removes the pill and edge tab here until the page reloads; other tabs keep theirs.","tag":"","w":1600,"h":1000,"shots":["B38-tab-closed-light.png"]},{"id":"B1","group":"2.7","title":"Page · selection bubble","note":"Selecting text pops a bubble above the selection: Listen (tooltip with its shortcut), voice...","tag":"","w":1600,"h":1000,"shots":["B1-selection-bubble-light.png"]},{"id":"B2","group const KEY = "speakkit-designs-v2";
let state = {}; try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const S = DATA.screens, G = DATA.groups;
const byGroup = {}; S.forEach(s => (byGroup[s.group] ??= []).push(s));
const groups = Object.keys(G).filter(k => byGroup[k]);
let filter = "all";
const get = id => state[id] || { s: "pending", n: "" };
const set = (id, p) => { state[id] = { ...get(id), ...p }; save(); };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const main = document.getElementById("main"); main.innerHTML = "";
  groups.forEach(k => {
    const sec = document.createElement("section"); sec.className = "feat"; sec.id = "g" + k;
    sec.innerHTML = '<div class="fh"><div class="k">' + k + '</div><div class="grow"><h2>' + esc(G[k].name) + '</h2><p>' + esc(G[k].blurb) + '</p></div><div class="nav"><button class="btn" data-nav="-1">&larr;</button><span class="cnt"></span><button class="btn" data-nav="1">&rarr;</button><button class="btn" data-all="' + k + '">Approve all ' + byGroup[k].length + '</button></div></div><div class="row"></div>';
    const row = sec.querySelector(".row");
    byGroup[k].forEach(s => {
      const st = get(s.id);
      const c = document.createElement("article"); c.className = "card"; c.dataset.s = st.s; c.dataset.id = s.id;
      if (filter !== "all" && st.s !== filter) c.classList.add("hide");
      c.innerHTML = '<div class="thumb"></div><div class="meta"><span class="id">' + s.id + '</span>' + (s.tag ? '<span class="dk">' + esc(s.tag) + '</span>' : "") + '<h3>' + esc(s.title) + '</h3><p>' + esc(s.note) + '</p>' + (s.shots.length ? '<div class="seg"><button data-v="design">Design</button><button data-v="built">Built</button><button data-v="side">Side by side</button></div>' + (s.shots.length > 1 ? '<select>' + s.shots.map((f, i) => '<option value="' + i + '">' + esc(f.replace(/-light\.png$/, "")) + '</option>').join("") + '</select>' : "") : '<div class="seg"><button class="on" disabled>Design only (no built screenshot)</button></div>') + '</div><div class="acts"><button class="a" data-set="approved">\u2713 Approve</button><button class="c" data-set="change">\u270E Change</button><button class="r" data-set="rejected">\u2715 Reject</button></div><textarea placeholder="What should change?" class="' + (st.n ? "has" : "") + '">' + esc(st.n) + '</textarea>'; paint(c);
      row.appendChild(c);
    });
    main.appendChild(sec);
  });
  stats();
}
let view = "design"; try { view = localStorage.getItem(KEY + "-view") || "design"; } catch (e) {}
const SH = "built/shots/";
function paint(c) {
  const s = S.find(x => x.id === c.dataset.id), t = c.querySelector(".thumb"); const v = s.shots.length ? (c.dataset.v || view) : "design";
  const sel = c.querySelector("select"), shot = SH + (s.shots[sel ? +sel.value : 0] || "");
  const d = '<img loading="lazy" src="screens/' + s.id + '.png" alt="' + esc(s.title) + ' design">', bi = s.shots.length ? '<img loading="lazy" src="' + shot + '" alt="' + esc(s.title) + ' built">' : "";
  t.className = "thumb " + (v === "design" ? "" : v); t.dataset.zoom = s.id;
  t.innerHTML = v === "design" ? d : v === "built" ? bi : '<div class="pane"><i>Design</i>' + d + '</div><div class="pane"><i>Built</i>' + bi + '</div>';
  c.querySelectorAll(".seg button[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
function stats() {
  const n = { pending: 0, approved: 0, change: 0, rejected: 0 }; S.forEach(s => n[get(s.id).s]++);
  const el = document.getElementById("stats");
  const mk = (f, l, v) => '<button class="pill ' + (filter === f ? "on" : "") + '" data-f="' + f + '">' + l + ' <b>' + v + '</b></button>';
  el.innerHTML = mk("all", "All", S.length) + mk("pending", "Pending", n.pending) + mk("approved", "Approved", n.approved) + mk("change", "Needs changes", n.change) + mk("rejected", "Rejected", n.rejected);
  document.getElementById("toc").innerHTML = groups.map(k => { const a = byGroup[k].filter(s => get(s.id).s === "approved").length; return '<a href="#g' + k + '">' + k + " \u00B7 " + esc(G[k].name.replace(/^(Desktop app|Chrome extension): /, "")) + '<span>' + a + "/" + byGroup[k].length + "</span></a>"; }).join("");
}
function apply(id, s) {
  set(id, { s });
  const c = document.querySelector('.card[data-id="' + id + '"]'); if (c) { c.dataset.s = s; if (filter !== "all" && s !== filter) c.classList.add("hide"); }
  stats(); if (lbIdx >= 0) lbShow();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-set],[data-zoom],[data-f],[data-all],[data-v],[data-nav]"); if (!t) return;
  if (t.dataset.v) { const c = t.closest(".card"); view = t.dataset.v; try { localStorage.setItem(KEY + "-view", view); } catch (e) {} document.querySelectorAll(".card").forEach(x => { delete x.dataset.v; paint(x); }); }
  else if (t.dataset.nav) { const r = t.closest("section").querySelector(".row"); r.scrollBy({ left: +t.dataset.nav * r.querySelector(".card").offsetWidth, behavior: "smooth" }); }
  else if (t.dataset.set) apply(t.closest(".card").dataset.id, get(t.closest(".card").dataset.id).s === t.dataset.set ? "pending" : t.dataset.set);
  else if (t.dataset.zoom) { lbIdx = S.findIndex(s => s.id === t.dataset.zoom); lbShow(); }
  else if (t.dataset.f) { filter = t.dataset.f; render(); }
  else if (t.dataset.all) { byGroup[t.dataset.all].forEach(s => set(s.id, { s: "approved" })); render(); }
});
document.addEventListener("change", e => { if (e.target.tagName === "SELECT") paint(e.target.closest(".card")); });
document.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") set(e.target.closest(".card").dataset.id, { n: e.target.value }); });
// lightbox
let lbBuilt = false, lbIdx = -1; const lb = document.getElementById("lb");
function lbShow() { const s = S[lbIdx]; if (!s) return; lb.classList.add("on"); document.getElementById("lbimg").src = lbBuilt && s.shots.length ? SH + s.shots[0] : "screens/" + s.id + ".png"; document.getElementById("lbt").textContent = s.id + " \u00B7 " + s.title; const st = get(s.id).s; document.getElementById("lbn").textContent = s.note + "   [" + st + "]"; }
function lbMove(d) { lbIdx = (lbIdx + d + S.length) % S.length; lbShow(); }
lb.addEventListener("click", e => { const k = e.target.dataset.k; if (!k) { if (e.target === lb) { lbIdx = -1; lb.classList.remove("on"); } return; } if (k === "x") { lbIdx = -1; lb.classList.remove("on"); } else if (k === "prev") lbMove(-1); else if (k === "next") lbMove(1); else apply(S[lbIdx].id, { a: "approved", c: "change", r: "rejected" }[k]); });
document.addEventListener("keydown", e => { if (lbIdx < 0 || e.target.tagName === "TEXTAREA") return; if (e.key === "ArrowRight") lbMove(1); else if (e.key === "ArrowLeft") lbMove(-1); else if (e.key.toLowerCase() === "b") { lbBuilt = !lbBuilt; lbShow(); } else if (e.key === "Escape") { lbIdx = -1; lb.classList.remove("on"); } else if ("acr".includes(e.key.toLowerCase())) apply(S[lbIdx].id, { a: "approved", c: "change", r: "rejected" }[e.key.toLowerCase()]); });
// export
const decisions = () => S.map(s => ({ id: s.id, feature: G[s.group].name, title: s.title, g: s.group, status: get(s.id).s, comment: get(s.id).n }));
document.getElementById("export").onclick = () => { const b = new Blob([JSON.stringify(decisions(), null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "design-decisions.json"; a.click(); };
document.getElementById("copy").onclick = async () => { const d = decisions(); const L = []; groups.forEach(k => { const x = d.filter(r => r.g === k && r.status !== "approved" && r.status !== "pending"); if (x.length) { L.push("## " + G[k].name); x.forEach(r => L.push("- " + r.id + " " + r.title + " \u2014 " + r.status + (r.comment ? ": " + r.comment : ""))); } }); const txt = L.join("\n") || "No change or reject notes yet."; try { await navigator.clipboard.writeText(txt); } catch (e) { prompt("Copy:", txt); } document.getElementById("copy").textContent = "Copied"; setTimeout(() => document.getElementById("copy").textContent = "Copy summary", 1200); };
document.addEventListener("scroll", e => { const r = e.target; if (!r.classList || !r.classList.contains("row")) return; const cs = [...r.children], w = cs[0].offsetWidth + 18, i = Math.round(r.scrollLeft / w) + 1; r.closest("section").querySelector(".cnt").textContent = Math.min(i, cs.length) + " / " + cs.length; }, true);
render(); document.querySelectorAll(".row").forEach(r => r.closest("section").querySelector(".cnt").textContent = "1 / " + r.children.length);
</script>
