<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakKit design review</title>
<style>
:root{--bg:#F3F3F6;--surface:#fff;--s2:#EBEBEE;--bd:#E2E2E5;--tx:#1E1F20;--tx2:#5E574E;--tx3:#8F887D;--ac:#0069CC;--acs:#DCE9F7;--ok:#1A7F4B;--oks:#DFF5EA;--wn:#B35C00;--wns:#FDF0D5;--er:#C62828;--ers:#FDE4E1;--sh:0 1px 3px #0001,0 6px 16px #0000000d}
:root[data-theme=dark]{--bg:#191A1B;--surface:#1E1F20;--s2:#252627;--bd:#2A2B2C;--tx:#E6E6E6;--tx2:#B9B2A7;--tx3:#857E73;--acs:#124368;--oks:#14382B;--wns:#3A2D12;--ers:#40201C;--ac:#0078D4;--ok:#4CC38A;--wn:#F5A524;--er:#F2555A;--sh:0 1px 3px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.bar{display:flex;gap:16px;align-items:center;padding:12px 24px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tx3);font-size:12.5px}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit}
.pill b{color:var(--tx)}.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.pill.on b{color:var(--bg)}
.btn{border:1px solid var(--bd);background:var(--surface);color:var(--tx);border-radius:9px;padding:6px 12px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--tx3)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
nav.toc{display:flex;gap:6px;padding:0 24px 12px;overflow-x:auto}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--tx2);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid transparent}
nav.toc a:hover{background:var(--s2)}nav.toc a span{color:var(--tx3);font-weight:500;margin-left:4px}
main{padding:8px 0 80px}
section.feat{padding:28px 0 6px}
.fh{padding:0 24px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fh .k{width:34px;height:34px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800}
.fh h2{margin:0;font-size:20px;letter-spacing:-.01em}.fh p{margin:2px 0 0;color:var(--tx2);max-width:760px}
.fh .grow{flex:1;min-width:260px}
.row{display:flex;gap:18px;overflow-x:auto;padding:16px 24px 18px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{height:10px}.row::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.card{flex:0 0 440px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.card[data-s=approved]{border-color:var(--ok)}.card[data-s=change]{border-color:var(--wn)}.card[data-s=rejected]{border-color:var(--er)}
.thumb{height:280px;background:var(--s2);display:grid;place-items:center;cursor:zoom-in;border-bottom:1px solid var(--bd);position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.meta{padding:12px 14px 6px}
.id{display:inline-block;font:700 11px ui-monospace,Consolas,monospace;background:var(--s2);color:var(--tx2);border-radius:6px;padding:2px 7px;margin-right:6px}
.dk{font-size:10.5px;font-weight:700;color:var(--tx3);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:4px}
.card h3{font-size:14.5px;margin:6px 0 2px}.card p{margin:0;color:var(--tx2);font-size:12.5px;min-height:36px}
.acts{display:flex;gap:6px;padding:10px 14px 12px}
.acts button{flex:1;border:1px solid var(--bd);background:var(--surface);color:var(--tx2);border-radius:8px;padding:7px 4px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.acts button:hover{background:var(--s2)}
.card[data-s=approved] .a{background:var(--oks);color:var(--ok);border-color:var(--ok)}
.card[data-s=change] .c{background:var(--wns);color:var(--wn);border-color:var(--wn)}
.card[data-s=rejected] .r{background:var(--ers);color:var(--er);border-color:var(--er)}
textarea{display:none;margin:0 14px 12px;width:calc(100% - 28px);border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);padding:8px;font:13px inherit;font-family:inherit;resize:vertical;min-height:54px}
.card[data-s=change] textarea,.card[data-s=rejected] textarea,textarea.has{display:block}
.hide{display:none!important}
#lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:78vh;border-radius:8px;box-shadow:0 20px 60px #000}
#lb .cap{color:#fff;text-align:center;max-width:900px}#lb .cap b{font-size:16px}#lb .cap div{opacity:.8;font-size:13px}
#lb .ctl{display:flex;gap:8px}#lb .btn{background:#ffffff1f;color:#fff;border-color:#ffffff33}
.hint{color:var(--tx3);font-size:12px}
@media(max-width:700px){.card{flex-basis:86vw}.thumb{height:220px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div><h1>SpeakKit design review</h1><div class="sub">142 screens &middot; 11 features &middot; click an image to enlarge &middot; keys in viewer: &larr; &rarr; move, A approve, C change, R reject</div></div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="theme">Theme</button>
    <button class="btn" id="copy">Copy summary</button>
    <button class="btn pri" id="export">Export decisions</button>
  </div>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<div id="lb"><img id="lbimg" alt=""><div class="cap"><b id="lbt"></b><div id="lbn"></div></div><div class="ctl"><button class="btn" data-k="prev">\u2190 Prev</button><button class="btn" data-k="a">Approve</button><button class="btn" data-k="c">Change</button><button class="btn" data-k="r">Reject</button><button class="btn" data-k="next">Next \u2192</button><button class="btn" data-k="x">Close</button></div></div>
<script>
const DATA = {"groups":{"A":{"name":"Chrome extension: toolbar popup","blurb":"The popup opened from the toolbar icon. Controls the current page and shows the link to the desktop app."},"B":{"name":"Chrome extension: on-page reading","blurb":"Selection bubble, paragraph play gutter, floating dock, read-along highlight, context menu and errors, drawn on a real article page."},"C":{"name":"Chrome extension: options and side panel","blurb":"Extension settings page (connection, voice, highlight look, shortcuts, site rules) and the queue side panel."},"D":{"name":"Desktop app: first-run setup","blurb":"Welcome, engine choice with hardware check, model download, extension pairing, test voice."},"E":{"name":"Desktop app: library","blurb":"Home with saved readings, adding content (paste, URL, file, drag and drop), search."},"F":{"name":"Desktop app: reader","blurb":"Text and PDF reading with read-along highlight, player bar, outline, display settings, sleep timer and finish states."},"G":{"name":"Voices and engines","blurb":"Kokoro voice library, Chatterbox voice cloning, engine manager, hardware warnings."},"H":{"name":"Desktop app: settings","blurb":"General, playback, pronunciation, browser integration, shortcuts, storage, appearance, about and updates."},"I":{"name":"Tray, mini player and global shortcuts","blurb":"Always-available surfaces outside the main window."},"J":{"name":"Export audio","blurb":"Save a reading as MP3 or WAV."},"K":{"name":"System states and errors","blurb":"Crashes, resource problems, permission and update dialogs."}},"screens":[{"id":"A1","group":"A","title":"Popup · idle on an article","note":"Nothing playing yet. One big action, selection (disabled until text is selected) and reader view.","w":520,"h":504,"dark":false},{"id":"A2","group":"A","title":"Popup · selection ready","note":"Text is selected on the page; the popup offers to read only that, with a real time estimate.","w":520,"h":511,"dark":false},{"id":"A3","group":"A","title":"Popup · preparing audio","note":"First sentence is being synthesized. Indeterminate bar, skip buttons disabled, Cancel available.","w":520,"h":510,"dark":false},{"id":"A4","group":"A","title":"Popup · playing","note":"Scrubber with time left, 10 s skips, previous/next paragraph.","w":520,"h":476,"dark":false},{"id":"A5","group":"A","title":"Popup · paused","note":"Same layout, play button instead of pause.","w":520,"h":476,"dark":false},{"id":"A6","group":"A","title":"Popup · voice picker","note":"Searchable voice list with language and accent filters; every row has a preview button.","w":520,"h":675,"dark":false},{"id":"A7","group":"A","title":"Popup · speed picker","note":"Slider with live value plus presets across the 0.5x to 3x range.","w":520,"h":538,"dark":false},{"id":"A8","group":"A","title":"Popup · finished","note":"End of page; main button becomes replay and the next queued item is offered.","w":520,"h":606,"dark":false},{"id":"A9","group":"A","title":"Popup · app not running","note":"The desktop app is closed. Launch it, or download it.","w":520,"h":474,"dark":false},{"id":"A10","group":"A","title":"Popup · model loading","note":"App is up but the voice engine is still starting. Skips disabled, Cancel available.","w":520,"h":526,"dark":false},{"id":"A11","group":"A","title":"Popup · page not readable","note":"Chrome internal pages and the Web Store block extensions.","w":520,"h":415,"dark":false},{"id":"A12","group":"A","title":"Popup · playing (dark)","note":"Dark theme follows the browser.","w":520,"h":476,"dark":true},{"id":"A13","group":"A","title":"Popup · app not installed","note":"First run: the app is not on this computer yet, so Download is the primary action.","w":520,"h":444,"dark":false},{"id":"A14","group":"A","title":"Popup · pairing token rejected","note":"App and browser no longer share a token; paste a new one in the extension options.","w":520,"h":463,"dark":false},{"id":"A15","group":"A","title":"Popup · local file needs permission","note":"file:// pages need “Allow access to file URLs” in the extension settings.","w":520,"h":463,"dark":false},{"id":"B1","group":"B","title":"Page · selection bubble","note":"Selecting text pops a bubble 8 px above the selection: Listen (with its shortcut on hover), voice and speed, copy.","w":1280,"h":800,"dark":false},{"id":"B2","group":"B","title":"Page · paragraph play gutter","note":"Hovering a paragraph tints it and shows a play button in the margin: read from here.","w":1280,"h":800,"dark":false},{"id":"B3","group":"B","title":"Page · context menu","note":"Native Chrome menu: SpeakKit submenu with read selection, read from here and add to queue.","w":1280,"h":800,"dark":false},{"id":"B4","group":"B","title":"Page · dock idle","note":"Floating dock appears at the bottom after the first use (can be hidden per site).","w":1280,"h":800,"dark":false},{"id":"B5","group":"B","title":"Page · dock preparing","note":"Spinner while the first chunk is synthesized.","w":1280,"h":800,"dark":false},{"id":"B6","group":"B","title":"Page · reading with highlight","note":"Sentence background plus a stronger current-word marker; auto-scroll follows.","w":1280,"h":800,"dark":false},{"id":"B7","group":"B","title":"Page · paused","note":"Highlight stays on the last spoken sentence; dock shows elapsed and total time.","w":1280,"h":800,"dark":false},{"id":"B8","group":"B","title":"Page · finished","note":"Dock confirms the end and offers replay.","w":1280,"h":800,"dark":false},{"id":"B9","group":"B","title":"Page · app offline error","note":"One surface only: the dock explains the problem and offers Open app and Retry; technical detail sits behind Details.","w":1280,"h":800,"dark":false},{"id":"B10","group":"B","title":"Page · reader view reading","note":"Distraction-free reader overlay with larger type and the same highlight. Close keeps playback running in the dock.","w":1280,"h":800,"dark":false},{"id":"B11","group":"B","title":"Page · reading (dark)","note":"Dark page and dark highlight palette.","w":1280,"h":800,"dark":true},{"id":"B12","group":"B","title":"Page · reader view (dark)","note":"Reader view in dark mode.","w":1280,"h":800,"dark":true},{"id":"B13","group":"B","title":"Page · added to queue","note":"Confirmation toast after Add to queue, with a link to the side panel.","w":1280,"h":800,"dark":false},{"id":"B14","group":"B","title":"Page · back to current","note":"The reader scrolled away from the spoken sentence; a pill jumps back to it.","w":1280,"h":800,"dark":false},{"id":"B15","group":"B","title":"Page · dock speed popover","note":"Speed popover opened from the dock pill; right edges aligned, slider shows the live value.","w":1280,"h":800,"dark":false},{"id":"B16","group":"B","title":"Page · dock voice popover","note":"Voice popover opened from the dock voice chip, with search and a preview button on every row.","w":1280,"h":800,"dark":false},{"id":"B17","group":"B","title":"Page · edge launcher, hidden","note":"Resting state: only a 14 px tab is visible at the right edge of the page, so it never covers content. Position is draggable up and down.","w":1280,"h":800,"dark":false},{"id":"B18","group":"B","title":"Page · edge launcher, hover","note":"Hovering the tab opens a vertical pill, like Speechify: logo, a big play button (tooltip shows the length), reader view, speed, voice, more.","w":1280,"h":800,"dark":false},{"id":"B19","group":"B","title":"Page · edge launcher, reading","note":"While reading, the tab stays peeking out wider with a pause button and a thin progress line. Click to pause or resume without opening it.","w":1280,"h":800,"dark":false},{"id":"B20","group":"B","title":"Page · edge launcher, reading expanded","note":"Hover while reading: the pill stacks pause, a vertical progress rail with time left, 10 s skips, speed, voice and stop. Moving away hides it after 1.5 s.","w":1280,"h":800,"dark":false},{"id":"B21","group":"B","title":"Page · edge launcher (dark)","note":"Same vertical pill on a dark page.","w":1280,"h":800,"dark":true},{"id":"C1","group":"C","title":"Options · General (connected)","note":"Connection status with response time, port, pairing token and where the extension shows UI.","w":1280,"h":800,"dark":false},{"id":"C2","group":"C","title":"Options · General (app not running)","note":"Same layout as connected; only the status card changes. Primary action launches the app, the error code sits behind Details.","w":1280,"h":800,"dark":false},{"id":"C3","group":"C","title":"Options · General (token rejected)","note":"Pairing token mismatch: paste a new token into the focused field, with Re-pair as the fallback.","w":1280,"h":800,"dark":false},{"id":"C4","group":"C","title":"Options · Voice and speed","note":"Engine cards with radio and install action, default voice, speed slider with live value, paragraph pause, preview.","w":1280,"h":800,"dark":false},{"id":"C5","group":"C","title":"Options · Highlighting","note":"Preview with light/dark switch and contrast readout, named color swatches with a custom option.","w":1280,"h":800,"dark":false},{"id":"C6","group":"C","title":"Options · Shortcuts","note":"Browser-wide Chrome shortcuts (edited in Chrome) and in-page keys, with Not set and conflict states.","w":1280,"h":800,"dark":false},{"id":"C7","group":"C","title":"Options · Sites and filters","note":"Skip rules and per-site rules; each rule is a dropdown (Always show dock, Hide controls, Never read).","w":1280,"h":800,"dark":false},{"id":"C8","group":"C","title":"Options · Highlighting (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"C9","group":"C","title":"Side panel · queue and outline","note":"Chrome side panel: now playing with transport, paragraph outline, up-next queue with Play now, Remove and Clear all.","w":1280,"h":800,"dark":false},{"id":"C10","group":"C","title":"Side panel · empty queue","note":"Empty state explains how to add pages; the page reflows beside the panel.","w":1280,"h":800,"dark":false},{"id":"C11","group":"C","title":"Side panel · queue (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"C12","group":"C","title":"Options · Edge launcher","note":"Turn the edge launcher on or off, choose its side, how it hides, when it opens and how long it stays open.","w":1280,"h":800,"dark":false},{"id":"D1","group":"D","title":"Welcome","note":"First launch. One promise: local, private, fast.","w":1280,"h":800,"dark":false},{"id":"D2","group":"D","title":"Choose engine (GPU found)","note":"Hardware verdict line; selectable engine cards, the button follows the selection.","w":1280,"h":800,"dark":false},{"id":"D3","group":"D","title":"Choose engine (no GPU)","note":"Chatterbox is locked with the reason and a link instead of failing later.","w":1280,"h":800,"dark":false},{"id":"D4","group":"D","title":"Downloading models","note":"Per-file progress, speed and ETA, the next step dimmed, can continue in the background.","w":1280,"h":800,"dark":false},{"id":"D5","group":"D","title":"Download paused","note":"Resumable. Retry, choose a file you downloaded yourself, auto-retry and proxy options.","w":1280,"h":800,"dark":false},{"id":"D6","group":"D","title":"Connect your browser","note":"Install, pin, then paste the pairing token. Continue stays disabled until the extension pairs.","w":1280,"h":800,"dark":false},{"id":"D7","group":"D","title":"Ready: hear a sample","note":"Pairing confirmed. Press play to hear the voice; tips for the shortcut, tray and startup.","w":1280,"h":800,"dark":false},{"id":"D8","group":"D","title":"Welcome (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"D9","group":"D","title":"Ready: extension skipped","note":"Setup finished without pairing; the extension can be connected later in Settings > Browser integration.","w":1280,"h":800,"dark":false},{"id":"E1","group":"E","title":"Library · empty","note":"First run with no content: one primary action (Choose file), quieter ways to paste or use a web address.","w":1280,"h":800,"dark":false},{"id":"E2","group":"E","title":"Library · with readings","note":"Continue-listening hero (not repeated in the list), filters, sort, rows with progress and time left.","w":1280,"h":800,"dark":false},{"id":"E3","group":"E","title":"Add · paste text","note":"Dialog with optional title, live word count, estimated time, voice; Add or Add and play.","w":1280,"h":800,"dark":false},{"id":"E4","group":"E","title":"Add · web address fetching","note":"Field is read-only while fetching; the found title confirms what will be added.","w":1280,"h":800,"dark":false},{"id":"E5","group":"E","title":"Add · web address failed","note":"Reason in plain words, details behind a line; Paste text instead is the way forward.","w":1280,"h":800,"dark":false},{"id":"E6","group":"E","title":"Library · dragging a file","note":"The whole content area becomes the drop target.","w":1280,"h":800,"dark":false},{"id":"E7","group":"E","title":"Library · search results","note":"Matches highlighted in title, source or text, result count and a clear button.","w":1280,"h":800,"dark":false},{"id":"E8","group":"E","title":"Library · no search results","note":"Clear search is the primary action; Add text is secondary.","w":1280,"h":800,"dark":false},{"id":"E9","group":"E","title":"Library · row menu","note":"Anchored to the row's trigger: play, rename, export, pin, voice, finished, folder, delete.","w":1280,"h":800,"dark":false},{"id":"E10","group":"E","title":"Library · delete confirmation","note":"Imported file: the original is untouched. Cancel has default focus.","w":1280,"h":800,"dark":false},{"id":"E11","group":"E","title":"Library · with readings (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"E12","group":"E","title":"Library · deleted toast","note":"After deleting, a toast offers Undo.","w":1280,"h":800,"dark":false},{"id":"E13","group":"E","title":"Library · added toast","note":"Success toast after adding; the new reading is at the top.","w":1280,"h":800,"dark":false},{"id":"E14","group":"E","title":"Library · dragging several files","note":"Drop target lists each accepted file.","w":1280,"h":800,"dark":false},{"id":"E15","group":"E","title":"Library · unsupported file","note":"Red drop target names the file type and lists the supported ones.","w":1280,"h":800,"dark":false},{"id":"E16","group":"E","title":"Library · delete pasted text","note":"Pasted text has no original, so the copy says it is the only copy.","w":1280,"h":800,"dark":false},{"id":"F1","group":"F","title":"Reader · playing","note":"Article with sentence and word highlight; the player bar shows 2:27 of 6:48 at 1.2x.","w":1280,"h":800,"dark":false},{"id":"F2","group":"F","title":"Reader · paused","note":"Same screen paused.","w":1280,"h":800,"dark":false},{"id":"F3","group":"F","title":"Reader · preparing next paragraph","note":"Short toast when synthesis falls behind; Pause stays available.","w":1280,"h":800,"dark":false},{"id":"F4","group":"F","title":"Reader · finished","note":"Completion card over a scrim: marks the reading finished, plays the next item or replays.","w":1280,"h":800,"dark":false},{"id":"F5","group":"F","title":"Reader · read from here","note":"Click a word: a chip above it offers Read from here and Copy.","w":1280,"h":800,"dark":false},{"id":"F6","group":"F","title":"Reader · outline and bookmarks","note":"Right panel with headings and saved bookmarks.","w":1280,"h":800,"dark":false},{"id":"F7","group":"F","title":"Reader · display settings","note":"Anchored to the Aa button: theme, text size and line spacing with values, font, toggles.","w":1280,"h":800,"dark":false},{"id":"F8","group":"F","title":"Reader · sleep timer","note":"Anchored to the timer in the player bar; shows the 29:12 countdown.","w":1280,"h":800,"dark":false},{"id":"F9","group":"F","title":"Reader · speed and voice","note":"Popover from the speed pill: slider with value, presets, voice and engine.","w":1280,"h":800,"dark":false},{"id":"F10","group":"F","title":"PDF reader · playing","note":"Player bar shows the PDF's own title, page and duration.","w":1280,"h":800,"dark":false},{"id":"F11","group":"F","title":"PDF reader · scanned page","note":"Page 9 has no text layer: offer local OCR; the player is disabled until it finishes.","w":1280,"h":800,"dark":false},{"id":"F12","group":"F","title":"Reader · playing (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"F13","group":"F","title":"PDF reader · recognizing text","note":"Local OCR progress: page 4 of 15, time left, cancel.","w":1280,"h":800,"dark":false},{"id":"F14","group":"F","title":"Reader · voice panel","note":"Docked right panel: current voice, recent voices, speed slider, advanced.","w":1280,"h":800,"dark":false},{"id":"F15","group":"F","title":"Reader · back to current","note":"After scrolling away from the spoken sentence, a pill jumps back.","w":1280,"h":800,"dark":false},{"id":"F16","group":"F","title":"Reader · search in text","note":"Find bar with result count and previous/next; matches highlighted.","w":1280,"h":800,"dark":false},{"id":"G1","group":"G","title":"Voices · library","note":"After Chatterbox is installed: Your voices on top, Kokoro voices as cards with accent, grade and preview (playing state shown), grade legend open.","w":1280,"h":800,"dark":false},{"id":"G2","group":"G","title":"Voices · detail drawer","note":"Scrim under the drawer, previous/next voice, editable try-it sentence. Heart is already the default, so the button is disabled.","w":1280,"h":800,"dark":false},{"id":"G3","group":"G","title":"Clone · choose reference","note":"Upload or record. Continue stays disabled until a clip is added and the consent box is ticked.","w":1280,"h":800,"dark":false},{"id":"G4","group":"G","title":"Clone · recording","note":"Stop button, 0:08 / 0:30 timer with the 0:10 minimum tick, live input meter. Continue is disabled while recording.","w":1280,"h":800,"dark":false},{"id":"G5","group":"G","title":"Clone · analyzing","note":"Three visible steps ith the overflow menu: Test, Reveal in folder, Voice style, Uninstall.","w":1280,"h":800,"dark":false},{"id":"H1","group":"H","title":"Settings · General","note":"Startup, tray, language, privacy and the clipboard prompt switch.","w":1280,"h":800,"dark":false},{"id":"H2","group":"H","title":"Settings · Playback","note":"Speed slider with value (0.5× to 3×), pauses and text clean-up rules.","w":1280,"h":800,"dark":false},{"id":"H3","group":"H","title":"Settings · Pronunciation","note":"Custom dictionary with respelling help, per-entry preview and delete with Undo.","w":1280,"h":800,"dark":false},{"id":"H4","group":"H","title":"Settings · Browser integration","note":"Server status, port with Apply and re-pair, token, destructive actions with confirm text.","w":1280,"h":800,"dark":false},{"id":"H5","group":"H","title":"Settings · Shortcuts","note":"Global Ctrl+Alt shortcuts, inline conflict on one row, in-app keys, Reset all.","w":1280,"h":800,"dark":false},{"id":"H6","group":"H","title":"Settings · Storage and models","note":"Usage adds up to 1.6 GB, segmented bar with legend, Clear asks first.","w":1280,"h":800,"dark":false},{"id":"H7","group":"H","title":"Settings · Appearance","note":"Theme, named highlight colors with a live preview.","w":1280,"h":800,"dark":false},{"id":"H8","group":"H","title":"Settings · About","note":"Version, update result, links and one row per open-source library.","w":1280,"h":800,"dark":false},{"id":"H9","group":"H","title":"Settings · Update available","note":"Update card with restart warning and Remind me later; dot on the About item.","w":1280,"h":800,"dark":false},{"id":"H10","group":"H","title":"Settings · Browser integration (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"H11","group":"H","title":"Settings · Shortcuts (recording a key)","note":"Capture state: Press new keys, Esc to cancel.","w":1280,"h":800,"dark":false},{"id":"I1","group":"I","title":"Tray menu · playing","note":"Windows 11 tray flyout, 12 px above the taskbar and aligned to the right edge: mini controls, Ctrl+Alt shortcuts, voice submenu, engine status.","w":1280,"h":800,"dark":false},{"id":"I2","group":"I","title":"Tray menu · idle","note":"Same flyout when nothing is playing.","w":1280,"h":800,"dark":false},{"id":"I3","group":"I","title":"Mini player · always on top","note":"Draggable header, time left, pin state with tooltip, previous/next and −10 / +10, overflow menu for the sleep timer. The document text stays visible.","w":1280,"h":800,"dark":false},{"id":"I4","group":"I","title":"Global shortcut toast","note":"Ctrl+Alt+S reads the selected text in any app. The toast offers pause and Stop; Esc is not captured.","w":1280,"h":800,"dark":false},{"id":"I5","group":"I","title":"Clipboard prompt","note":"Optional prompt after copying long text. Skips password-manager copies. Turn off lives in the … menu, with an 8 s countdown.","w":1280,"h":800,"dark":false},{"id":"I6","group":"I","title":"Tray menu · playing (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"I7","group":"I","title":"Tray menu · engine loading","note":"Read actions are disabled while Kokoro loads; status shows the wait.","w":1280,"h":800,"dark":false},{"id":"I8","group":"I","title":"Tray menu · engine error","note":"Engine stopped: red status, Restart engine, read actions disabled.","w":1280,"h":800,"dark":false},{"id":"I9","group":"I","title":"Mini player · states","note":"Paused, preparing the voice, and finished (replay).","w":1280,"h":800,"dark":false},{"id":"J1","group":"J","title":"Export · options","note":"Format, MP3 quality, voice and speed, file name, folder with Browse, size estimate.","w":1280,"h":800,"dark":false},{"id":"J2","group":"J","title":"Export · rendering","note":"Progress per sentence. Run in background is primary; Cancel export is destructive. No header X.","w":1280,"h":800,"dark":false},{"id":"J3","group":"J","title":"Export · done","note":"Full-width preview with time, path with Copy, Open file and Show in folder.","w":1280,"h":800,"dark":false},{"id":"J4","group":"J","title":"Export · options (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"J5","group":"J","title":"Export · file exists","note":"Replace, Keep both, or Choose another name.","w":1280,"h":800,"dark":false},{"id":"J6","group":"J","title":"Export · in background","note":"Sidebar progress pill and the library row show the running export.","w":1280,"h":800,"dark":false},{"id":"J7","group":"J","title":"Export · complete toast","note":"Non-blocking toast with Show in folder.","w":1280,"h":800,"dark":false},{"id":"K1","group":"K","title":"Error · engine crashed","note":"Over the reader with the player visible. Sidebar shows Restarting…; Details holds the exit code.","w":1280,"h":800,"dark":false},{"id":"K2","group":"K","title":"Error · port in use","note":"Over Settings > Browser integration. Sidebar shows Extension link blocked; port number lives in Details.","w":1280,"h":800,"dark":false},{"id":"K3","group":"K","title":"Error · low disk space","note":"Over Engines at the Chatterbox download card, with a hard-drive icon.","w":1280,"h":800,"dark":false},{"id":"K4","group":"K","title":"Error · model checksum failed","note":"Over the library. Repair is the primary action; checksum sits behind Details; Open Engines because Chatterbox isn't installed.","w":1280,"h":800,"dark":false},{"id":"K5","group":"K","title":"Notice · extension out of date","note":"Non-blocking banner under the title bar; no dialog.","w":1280,"h":800,"dark":false},{"id":"K6","group":"K","title":"Permission · microphone blocked","note":"Over the clone screen after Record now. Upload a file is the alternative.","w":1280,"h":800,"dark":false},{"id":"K7","group":"K","title":"Notice · already running","note":"No dialog: the existing window is restored and a toast says why.","w":1280,"h":800,"dark":false},{"id":"K8","group":"K","title":"Notice · offline","note":"Status chip in the header plus a toast; nothing blocks the app.","w":1280,"h":800,"dark":false},{"id":"K9","group":"K","title":"Error · engine crashed (dark)","note":"Dark theme variant.","w":1280,"h":800,"dark":true},{"id":"K10","group":"K","title":"Error · repairing model","note":"Repair progress with size and time left; can run in the background.","w":1280,"h":800,"dark":false}]};
const KEY = "design-review-v1-speakkit";
let state = {}; try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const S = DATA.screens, G = DATA.groups;
const byGroup = {}; S.forEach(s => (byGroup[s.group] ??= []).push(s));
const groups = Object.keys(G).filter(k => byGroup[k]);
let filter = "all";
const get = id => state[id] || { s: "pending", n: "" };
const set = (id, p) => { state[id] = { ...get(id), ...p }; save(); };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const main = document.getElementById("main"); main.innerHTML = "";
  groups.forEach(k => {
    const sec = document.createElement("section"); sec.className = "feat"; sec.id = "g" + k;
    sec.innerHTML = '<div class="fh"><div class="k">' + k + '</div><div class="grow"><h2>' + esc(G[k].name) + '</h2><p>' + esc(G[k].blurb) + '</p></div><button class="btn" data-all="' + k + '">Approve all ' + byGroup[k].length + '</button></div><div class="row"></div>';
    const row = sec.querySelector(".row");
    byGroup[k].forEach(s => {
      const st = get(s.id);
      const c = document.createElement("article"); c.className = "card"; c.dataset.s = st.s; c.dataset.id = s.id;
      if (filter !== "all" && st.s !== filter) c.classList.add("hide");
      c.innerHTML = '<div class="thumb" data-zoom="' + s.id + '"><img loading="lazy" src="screens/' + s.id + '.png" alt="' + esc(s.title) + '"></div><div class="meta"><span class="id">' + s.id + '</span>' + (s.dark ? '<span class="dk">DARK</span>' : "") + '<h3>' + esc(s.title) + '</h3><p>' + esc(s.note) + '</p></div><div class="acts"><button class="a" data-set="approved">\u2713 Approve</button><button class="c" data-set="change">\u270E Change</button><button class="r" data-set="rejected">\u2715 Reject</button></div><textarea placeholder="What should change?" class="' + (st.n ? "has" : "") + '">' + esc(st.n) + '</textarea>';
      row.appendChild(c);
    });
    main.appendChild(sec);
  });
  stats();
}
function stats() {
  const n = { pending: 0, approved: 0, change: 0, rejected: 0 }; S.forEach(s => n[get(s.id).s]++);
  const el = document.getElementById("stats");
  const mk = (f, l, v) => '<button class="pill ' + (filter === f ? "on" : "") + '" data-f="' + f + '">' + l + ' <b>' + v + '</b></button>';
  el.innerHTML = mk("all", "All", S.length) + mk("pending", "Pending", n.pending) + mk("approved", "Approved", n.approved) + mk("change", "Needs changes", n.change) + mk("rejected", "Rejected", n.rejected);
  document.getElementById("toc").innerHTML = groups.map(k => { const a = byGroup[k].filter(s => get(s.id).s === "approved").length; return '<a href="#g' + k + '">' + k + " \u00B7 " + esc(G[k].name.replace(/^(Desktop app|Chrome extension): /, "")) + '<span>' + a + "/" + byGroup[k].length + "</span></a>"; }).join("");
}
function apply(id, s) {
  set(id, { s });
  const c = document.querySelector('.card[data-id="' + id + '"]'); if (c) { c.dataset.s = s; if (filter !== "all" && s !== filter) c.classList.add("hide"); }
  stats(); if (lbIdx >= 0) lbShow();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-set],[data-zoom],[data-f],[data-all]"); if (!t) return;
  if (t.dataset.set) apply(t.closest(".card").dataset.id, get(t.closest(".card").dataset.id).s === t.dataset.set ? "pending" : t.dataset.set);
  else if (t.dataset.zoom) { lbIdx = S.findIndex(s => s.id === t.dataset.zoom); lbShow(); }
  else if (t.dataset.f) { filter = t.dataset.f; render(); }
  else if (t.dataset.all) { byGroup[t.dataset.all].forEach(s => set(s.id, { s: "approved" })); render(); }
});
document.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") set(e.target.closest(".card").dataset.id, { n: e.target.value }); });
// lightbox
let lbIdx = -1; const lb = document.getElementById("lb");
function lbShow() { const s = S[lbIdx]; if (!s) return; lb.classList.add("on"); document.getElementById("lbimg").src = "screens/" + s.id + ".png"; document.getElementById("lbt").textContent = s.id + " \u00B7 " + s.title; const st = get(s.id).s; document.getElementById("lbn").textContent = s.note + "   [" + st + "]"; }
function lbMove(d) { lbIdx = (lbIdx + d + S.length) % S.length; lbShow(); }
lb.addEventListener("click", e => { const k = e.target.dataset.k; if (!k) { if (e.target === lb) { lbIdx = -1; lb.classList.remove("on"); } return; } if (k === "x") { lbIdx = -1; lb.classList.remove("on"); } else if (k === "prev") lbMove(-1); else if (k === "next") lbMove(1); else apply(S[lbIdx].id, { a: "approved", c: "change", r: "rejected" }[k]); });
document.addEventListener("keydown", e => { if (lbIdx < 0 || e.target.tagName === "TEXTAREA") return; if (e.key === "ArrowRight") lbMove(1); else if (e.key === "ArrowLeft") lbMove(-1); else if (e.key === "Escape") { lbIdx = -1; lb.classList.remove("on"); } else if ("acr".includes(e.key.toLowerCase())) apply(S[lbIdx].id, { a: "approved", c: "change", r: "rejected" }[e.key.toLowerCase()]); });
// export
const decisions = () => S.map(s => ({ id: s.id, feature: G[s.group].name, title: s.title, status: get(s.id).s, comment: get(s.id).n }));
document.getElementById("export").onclick = () => { const b = new Blob([JSON.stringify(decisions(), null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "design-decisions.json"; a.click(); };
document.getElementById("copy").onclick = async () => { const d = decisions(); const L = []; groups.forEach(k => { const x = d.filter(r => r.id.replace(/\d+/, "") === k && r.status !== "approved" && r.status !== "pending"); if (x.length) { L.push("## " + G[k].name); x.forEach(r => L.push("- " + r.id + " " + r.title + " \u2014 " + r.status + (r.comment ? ": " + r.comment : ""))); } }); const txt = L.join("\n") || "No change or reject notes yet."; try { await navigator.clipboard.writeText(txt); } catch (e) { prompt("Copy:", txt); } document.getElementById("copy").textContent = "Copied"; setTimeout(() => document.getElementById("copy").textContent = "Copy summary", 1200); };
const root = document.documentElement; const th = (() => { try { return localStorage.getItem(KEY + "-theme"); } catch (e) { return null; } })();
if (th) root.dataset.theme = th; else if (matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme = "dark";
document.getElementById("theme").onclick = () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch (e) {} };
render();
</script>
