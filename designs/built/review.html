<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakKit built review</title>
<style>
:root{--bg:#F3F3F6;--surface:#fff;--s2:#EBEBEE;--bd:#E2E2E5;--tx:#1E1F20;--tx2:#5E574E;--tx3:#8F887D;--ac:#0069CC;--acs:#DCE9F7;--ok:#1A7F4B;--oks:#DFF5EA;--wn:#B35C00;--wns:#FDF0D5;--er:#C62828;--ers:#FDE4E1;--sh:0 1px 3px #0001,0 6px 16px #0000000d}
:root[data-theme=dark]{--bg:#191A1B;--surface:#1E1F20;--s2:#252627;--bd:#2A2B2C;--tx:#E6E6E6;--tx2:#B9B2A7;--tx3:#857E73;--acs:#124368;--oks:#14382B;--wns:#3A2D12;--ers:#40201C;--ac:#0078D4;--ok:#4CC38A;--wn:#F5A524;--er:#F2555A;--sh:0 1px 3px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.bar{display:flex;gap:12px;align-items:center;padding:12px 24px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tx3);font-size:12.5px}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit}
.pill b{color:var(--tx)}.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.pill.on b{color:var(--bg)}
.btn{border:1px solid var(--bd);background:var(--surface);color:var(--tx);border-radius:9px;padding:6px 12px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--tx3)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--tx2);padding:5px 10px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg)}
nav.toc{display:flex;gap:6px;padding:0 24px 12px;overflow-x:auto}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--tx2);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid transparent}
nav.toc a:hover{background:var(--s2)}nav.toc a span{color:var(--tx3);font-weight:500;margin-left:4px}
main{padding:8px 0 80px}
section.feat{padding:28px 0 6px}
.fh{padding:0 24px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fh .k{min-width:34px;padding:0 6px;height:34px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800}
.fh h2{margin:0;font-size:20px;letter-spacing:-.01em}.fh p{margin:2px 0 0;color:var(--tx2);max-width:820px}
.fh .grow{flex:1;min-width:260px}
.row{display:flex;gap:18px;overflow-x:auto;padding:16px 24px 18px;scroll-snap-type:x mandatory;scroll-padding-left:24px}
.row::-webkit-scrollbar{height:10px}.row::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.card{flex:0 0 var(--cw,460px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
body.cmp .card{--cw:860px}
.card[data-s=approved]{border-color:var(--ok)}.card[data-s=change]{border-color:var(--wn)}.card[data-s=rejected]{border-color:var(--er)}
.thumbs{display:flex;gap:1px;background:var(--bd);border-bottom:1px solid var(--bd)}
.thumb{flex:1;min-width:0;height:300px;background:var(--s2);cursor:zoom-in;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.thumb i{position:absolute;left:8px;top:8px;font:700 10px ui-monospace,Consolas,monospace;background:#000b;color:#fff;border-radius:5px;padding:2px 6px;font-style:normal;z-index:1}
.thumb.none{display:grid;place-items:center;color:var(--tx3);font-size:12.5px;cursor:default;text-align:center;padding:12px}
.meta{padding:12px 14px 6px}
.id{display:inline-block;font:700 11px ui-monospace,Consolas,monospace;background:var(--s2);color:var(--tx2);border-radius:6px;padding:2px 7px;margin-right:6px}
.dk{font-size:10.5px;font-weight:700;color:var(--tx3);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.dk.match{color:var(--ok);border-color:var(--ok)}.dk.minor{color:var(--wn);border-color:var(--wn)}.dk.known,.dk.major{color:var(--er);border-color:var(--er)}
.card h3{font-size:14.5px;margin:6px 0 2px}.card p{margin:0;color:var(--tx2);font-size:12.5px;min-height:18px}
.tr{display:flex;align-items:center;gap:8px;padding:6px 14px 0}
.acts{display:flex;gap:6px;padding:10px 14px 12px}
.acts button{flex:1;border:1px solid var(--bd);background:var(--surface);color:var(--tx2);border-radius:8px;padding:7px 4px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.acts button:hover{background:var(--s2)}
.card[data-s=approved] .a{background:var(--oks);color:var(--ok);border-color:var(--ok)}
.card[data-s=change] .c{background:var(--wns);color:var(--wn);border-color:var(--wn)}
.card[data-s=rejected] .r{background:var(--ers);color:var(--er);border-color:var(--er)}
textarea{display:none;margin:0 14px 12px;width:calc(100% - 28px);border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);padding:8px;font:13px inherit;font-family:inherit;resize:vertical;min-height:54px}
.card[data-s=change] textarea,.card[data-s=rejected] textarea,textarea.has{display:block}
.hide{display:none!important}
.miss{padding:0 24px 40px}.miss table{border-collapse:collapse;width:100%;max-width:1100px;font-size:12.5px}
.miss td,.miss th{border-bottom:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top}.miss th{color:var(--tx3);font-weight:600}
.miss code{font:700 11px ui-monospace,Consolas,monospace;background:var(--s2);border-radius:5px;padding:1px 6px}
#lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
#lb.on{display:flex}#lb .imgs{display:flex;gap:10px;align-items:flex-start;justify-content:center;max-width:98vw}
#lb img{max-width:96vw;max-height:76vh;border-radius:8px;box-shadow:0 20px 60px #000;min-width:0}body.cmp #lb img{max-width:47vw}
#lb .cap{color:#fff;text-align:center;max-width:900px}#lb .cap b{font-size:16px}#lb .cap div{opacity:.8;font-size:13px}
#lb .ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#lb .btn{background:#ffffff1f;color:#fff;border-color:#ffffff33}
@media(max-width:700px){.card,body.cmp .card{flex-basis:88vw}.thumbs{flex-direction:column}.thumb{height:220px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div><h1>SpeakKit built review</h1><div class="sub" id="sub"></div></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar" style="padding-top:0">
    <span class="sub">Screens</span><span class="seg" id="gth"><button data-t="dark">Dark</button><button data-t="light">Light</button></span>
    <button class="btn" id="cmp">Compare with design</button>
    <button class="btn" id="theme">Page theme</button>
    <button class="btn" id="copy">Copy summary</button>
    <button class="btn pri" id="export">Export decisions</button>
  </div>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<div id="lb"><div class="imgs"><img id="lbd" alt="" class="hide"><img id="lbimg" alt=""></div><div class="cap"><b id="lbt"></b><div id="lbn"></div></div><div class="ctl"><button class="btn" data-k="prev">&larr; Prev</button><button class="btn" data-k="a">Approve</button><button class="btn" data-k="c">Change</button><button class="btn" data-k="r">Reject</button><button class="btn" data-k="t">Theme (T)</button><button class="btn" data-k="d">Compare (D)</button><button class="btn" data-k="next">Next &rarr;</button><button class="btn" data-k="x">Close</button></div></div>

const setPref = (k, v) => { try { localStorage.setItem(KEY + "-" + k, v); } catch (e) {} };
const C = DATA.cards, G = DATA.groups;
const byGroup = {}; C.forEach(c => (byGroup[c.group] ??= []).push(c));
const groups = G.filter(g => byGroup[g.key]);
let filter = "all", gTheme = pref("gtheme", "dark"), cmp = pref("cmp", "0") === "1";
const get = k => state[k] || { s: "pending", n: "" };
const set = (k, p) => { state[k] = { ...get(k), ...p }; save(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const themeOf = c => c.th && c.shots[c.th] ? c.th : c.shots[gTheme] ? gTheme : (c.shots.dark ? "dark" : "light");
const label = r => r ? ({ match: "match", minor: "minor drift", known: "known difference", major: "drifts", only: "product only", twin: "no light twin" }[r.verdict] + (r.pct != null ? " " + r.pct + "%" : "")) : "";
function thumbs(c) {
  const t = themeOf(c), r = c.res[t];
  const built = '<div class="thumb" data-zoom="' + c.key + '"><i>BUILT · ' + t.toUpperCase() + '</i><img loading="lazy" src="shots/' + c.shots[t] + '" alt="' + esc(c.title) + '"></div>';
  if (!cmp) return built;
  const d = r && r.design ? '<div class="thumb" data-zoom="' + c.key + '"><i>DESIGN</i><img loading="lazy" src="design/' + r.design + '" alt=""></div>' : '<div class="thumb none">No design frame for this theme</div>';
  return d + built;
}
function render() {
  const main = document.getElementById("main"); main.innerHTML = "";
  document.body.classList.toggle("cmp", cmp);
  groups.forEach(g => {
    const sec = document.createElement("section"); sec.className = "feat"; sec.id = "g-" + g.key;
    const list = byGroup[g.key];
    sec.innerHTML = '<div class="fh"><div class="k">' + g.n + '</div><div class="grow"><h2>' + esc(g.name) + '</h2><p>' + esc(g.blurb) + ' <span class="sub">' + list.length + ' screens</span></p></div><button class="btn" data-all="' + g.key + '">Approve all</button></div><div class="row"></div>';
    const row = sec.querySelector(".row");
    list.forEach(c => {
      const st = get(c.key), t = themeOf(c), r = c.res[t];
      const el = document.createElement("article"); el.className = "card"; el.dataset.s = st.s; el.dataset.key = c.key;
      if (filter !== "all" && st.s !== filter) el.classList.add("hide");
      const both = c.shots.dark && c.shots.light;
      el.innerHTML = '<div class="thumbs">' + thumbs(c) + '</div><div class="meta"><span class="id">' + c.id + '</span><span class="dk">' + esc(c.state) + '</span>' + (r ? '<span class="dk ' + r.verdict + '">' + label(r) + '</span>' : '<span class="dk">no design to diff</span>') + '<h3>' + esc(c.title) + '</h3><p>' + esc(r && r.reason ? r.reason : "") + '</p></div>'
        + '<div class="tr">' + (both ? '<span class="seg" data-ct><button data-t="dark" class="' + (t === "dark" ? "on" : "") + '">Dark</button><button data-t="light" class="' + (t === "light" ? "on" : "") + '">Light</button></span>' : '<span class="sub">' + t + ' only</span>') + '</div>'
        + '<div class="acts"><button class="a" data-set="approved">&#10003; Approve</button><button class="c" data-set="change">&#9998; Change</button><button class="r" data-set="rejected">&#10005; Reject</button></div><textarea placeholder="What should change?" class="' + (st.n ? "has" : "") + '">' + esc(st.n) + '</textarea>';
      row.appendChild(el);
    });
    main.appendChild(sec);
  });
  const miss = document.createElement("section"); miss.className = "feat miss"; miss.id = "g-missing";
  miss.innerHTML = '<div class="fh"><div class="k">!</div><div class="grow"><h2>Not captured</h2><p>Design screens that could not be captured from the built product, with the reason. ' + DATA.missing.length + ' frames.</p></div></div><div style="padding:14px 0"><table><tr><th>Id</th><th>Design screen</th><th>Reason</th></tr>' + DATA.missing.map(m => '<tr><td><code>' + esc(m.id) + '</code></td><td>' + esc(m.title) + '</td><td>' + esc(m.reason) + '</td></tr>').join("") + '</table></div>';
  main.appendChild(miss);
  stats();
}
function stats() {
  const n = { pending: 0, approved: 0, change: 0, rejected: 0 }; C.forEach(c => n[get(c.key).s]++);
  const mk = (f, l, v) => '<button class="pill ' + (filter === f ? "on" : "") + '" data-f="' + f + '">' + l + ' <b>' + v + '</b></button>';
  document.getElementById("stats").innerHTML = mk("all", "All", C.length) + mk("pending", "Pending", n.pending) + mk("approved", "Approved", n.approved) + mk("change", "Needs changes", n.change) + mk("rejected", "Rejected", n.rejected);
  document.getElementById("toc").innerHTML = groups.map(g => '<a href="#g-' + g.key + '">' + esc(g.name) + '<span>' + byGroup[g.key].filter(c => get(c.key).s === "approved").length + '/' + byGroup[g.key].length + '</span></a>').join("") + '<a href="#g-missing">Not captured<span>' + DATA.missing.length + '</span></a>';
  document.getElementById("sub").textContent = C.length + " screens captured from the built product (" + DATA.counts.shots + " images, light and dark) · " + groups.length + " features · click an image to enlarge · viewer keys: ← → move, A approve, C change, R reject, T theme, D compare";
  document.querySelectorAll("#gth button").forEach(b => b.classList.toggle("on", b.dataset.t === gTheme));
  document.getElementById("cmp").classList.toggle("on", cmp);
}
function apply(key, s) {
  set(key, { s });
  const el = document.querySelector('.card[data-key="' + key + '"]'); if (el) { el.dataset.s = s; if (filter !== "all" && s !== filter) el.classList.add("hide"); }
  stats(); if (lbIdx >= 0) lbShow();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-set],[data-zoom],[data-f],[data-all],#gth button,#cmp,[data-ct] button"); if (!t) return;
  if (t.dataset.set) { const k = t.closest(".card").dataset.key; apply(k, get(k).s === t.dataset.set ? "pending" : t.dataset.set); }
  else if (t.dataset.zoom) { lbIdx = C.findIndex(c => c.key === t.dataset.zoom); lbShow(); }
  else if (t.dataset.f) { filter = t.dataset.f; render(); }
  else if (t.dataset.all) { byGroup[t.dataset.all].forEach(c => set(c.key, { s: "approved" })); render(); }
  else if (t.id === "cmp") { cmp = !cmp; setPref("cmp", cmp ? "1" : "0"); render(); }
  else if (t.closest("#gth")) { gTheme = t.dataset.t; setPref("gtheme", gTheme); C.forEach(c => { delete c.th; }); render(); }
  else if (t.closest("[data-ct]")) { const c = C.find(x => x.key === t.closest(".card").dataset.key); c.th = t.dataset.t; const row = t.closest(".row"), x = row.scrollLeft; render(); document.querySelector('.card[data-key="' + c.key + '"]').closest(".row").scrollLeft = x; }
});
document.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") set(e.target.closest(".card").dataset.key, { n: e.target.value }); });
let lbIdx = -1; const lb = document.getElementById("lb");
function lbShow() {
  const c = C[lbIdx]; if (!c) return; lb.classList.add("on");
  const t = themeOf(c), r = c.res[t];
  document.getElementById("lbimg").src = "shots/" + c.shots[t];
  const d = document.getElementById("lbd"); d.classList.toggle("hide", !(cmp && r && r.design)); if (cmp && r && r.design) d.src = "design/" + r.design;
  document.getElementById("lbt").textContent = c.id + " · " + c.title + " · " + t;
  document.getElementById("lbn").textContent = (r ? label(r) + ". " + (r.reason || "") : "No design to diff.") + "   [" + get(c.key).s + "]";
}
const lbMove = d => { lbIdx = (lbIdx + d + C.length) % C.length; lbShow(); };
const lbClose = () => { lbIdx = -1; lb.classList.remove("on"); };
const lbTheme = () => { const c = C[lbIdx]; if (c.shots.dark && c.shots.light) { c.th = themeOf(c) === "dark" ? "light" : "dark"; lbShow(); render(); } };
lb.addEventListener("click", e => { const k = e.target.dataset.k; if (!k) { if (e.target === lb) lbClose(); return; } if (k === "x") lbClose(); else if (k === "prev") lbMove(-1); else if (k === "next") lbMove(1); else if (k === "t") lbTheme(); else if (k === "d") { cmp = !cmp; setPref("cmp", cmp ? "1" : "0"); render(); lbShow(); } else apply(C[lbIdx].key, { a: "approved", c: "change", r: "rejected" }[k]); });
document.addEventListener("keydown", e => { if (lbIdx < 0 || e.target.tagName === "TEXTAREA") return; const k = e.key.toLowerCase(); if (e.key === "ArrowRight") lbMove(1); else if (e.key === "ArrowLeft") lbMove(-1); else if (e.key === "Escape") lbClose(); else if (k === "t") lbTheme(); else if (k === "d") { cmp = !cmp; setPref("cmp", cmp ? "1" : "0"); render(); lbShow(); } else if ("acr".includes(k)) apply(C[lbIdx].key, { a: "approved", c: "change", r: "rejected" }[k]); });
const decisions = () => C.map(c => ({ id: c.id, state: c.state, feature: c.groupName, title: c.title, status: get(c.key).s, comment: get(c.key).n, diff: { dark: c.res.dark && c.res.dark.pct, light: c.res.light && c.res.light.pct } }));
document.getElementById("export").onclick = () => { const b = new Blob([JSON.stringify(decisions(), null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "built-review-decisions.json"; a.click(); };
document.getElementById("copy").onclick = async () => { const d = decisions(); const L = []; groups.forEach(g => { const x = d.filter(r => r.feature === g.name && r.status !== "approved" && r.status !== "pending"); if (x.length) { L.push("## " + g.name); x.forEach(r => L.push("- " + r.id + " " + r.state + " " + r.title + " — " + r.status + (r.comment ? ": " + r.comment : ""))); } }); const txt = L.join("\n") || "No change or reject notes yet."; try { await navigator.clipboard.writeText(txt); } catch (e) { prompt("Copy:", txt); } document.getElementById("copy").textContent = "Copied"; setTimeout(() => document.getElementById("copy").textContent = "Copy summary", 1200); };
const root = document.documentElement; const th = pref("theme", "");
if (th) root.dataset.theme = th; else if (matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme = "dark";
document.getElementById("theme").onclick = () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; setPref("theme", root.dataset.theme); };
render();
</script>
</body>
</html>
