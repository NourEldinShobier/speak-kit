<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpeakKit built review</title>
    <style>
      :root {
        --bg: #f3f3f6;
        --surface: #fff;
        --s2: #ebebee;
        --bd: #e2e2e5;
        --tx: #1e1f20;
        --tx2: #5e574e;
        --tx3: #8f887d;
        --ac: #0069cc;
        --acs: #dce9f7;
        --ok: #1a7f4b;
        --oks: #dff5ea;
        --wn: #b35c00;
        --wns: #fdf0d5;
        --er: #c62828;
        --ers: #fde4e1;
        --sh: 0 1px 3px #0001, 0 6px 16px #0000000d;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 150px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.45 Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--bd);
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 24px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--tx3);
        font-size: 12.5px;
      }
      .stats {
        display: flex;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--bd);
        background: var(--surface);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--tx2);
        cursor: pointer;
        font-family: inherit;
      }
      .pill b {
        color: var(--tx);
      }
      .pill.on {
        background: var(--tx);
        color: var(--bg);
        border-color: var(--tx);
      }
      .pill.on b {
        color: var(--bg);
      }
      .btn {
        border: 1px solid var(--bd);
        background: var(--surface);
        color: var(--tx);
        border-radius: 9px;
        padding: 6px 12px;
        font: 600 12.5px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--tx3);
      }
      .btn.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .btn.on {
        background: var(--tx);
        color: var(--bg);
        border-color: var(--tx);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--bd);
        border-radius: 9px;
        overflow: hidden;
        background: var(--surface);
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--tx2);
        padding: 5px 10px;
        font: 600 12px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--tx);
        color: var(--bg);
      }
      nav.toc {
        display: flex;
        gap: 6px;
        padding: 0 24px 12px;
        overflow-x: auto;
      }
      nav.toc a {
        white-space: nowrap;
        text-decoration: none;
        color: var(--tx2);
        font-size: 12.5px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
      }
      nav.toc a:hover {
        background: var(--s2);
      }
      nav.toc a span {
        color: var(--tx3);
        font-weight: 500;
        margin-left: 4px;
      }
      main {
        padding: 8px 0 80px;
      }
      section.feat {
        padding: 28px 0 6px;
      }
      .fh {
        padding: 0 24px;
        display: flex;
        gap: 14px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .fh .k {
        min-width: 34px;
        padding: 0 6px;
        height: 34px;
        border-radius: 10px;
        background: var(--acs);
        color: var(--ac);
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .fh h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .fh p {
        margin: 2px 0 0;
        color: var(--tx2);
        max-width: 820px;
      }
      .fh .grow {
        flex: 1;
        min-width: 260px;
      }
      .row {
        display: flex;
        gap: 18px;
        overflow-x: auto;
        padding: 16px 24px 18px;
        scroll-snap-type: x mandatory;
        scroll-padding-left: 24px;
      }
      .row::-webkit-scrollbar {
        height: 10px;
      }
      .row::-webkit-scrollbar-thumb {
        background: var(--bd);
        border-radius: 6px;
      }
      .card {
        flex: 0 0 var(--cw, 460px);
        scroll-snap-align: start;
        background: var(--surface);
        border: 1px solid var(--bd);
        border-radius: 14px;
        box-shadow: var(--sh);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.cmp .card {
        --cw: 860px;
      }
      .card[data-s="approved"] {
        border-color: var(--ok);
      }
      .card[data-s="change"] {
        border-color: var(--wn);
      }
      .card[data-s="rejected"] {
        border-color: var(--er);
      }
      .thumbs {
        display: flex;
        gap: 1px;
        background: var(--bd);
        border-bottom: 1px solid var(--bd);
      }
      .thumb {
        flex: 1;
        min-width: 0;
        height: 300px;
        background: var(--s2);
        cursor: zoom-in;
        position: relative;
      }
      .thumb img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .thumb i {
        position: absolute;
        left: 8px;
        top: 8px;
        font:
          700 10px ui-monospace,
          Consolas,
          monospace;
        background: #000b;
        color: #fff;
        border-radius: 5px;
        padding: 2px 6px;
        font-style: normal;
        z-index: 1;
      }
      .thumb.none {
        display: grid;
        place-items: center;
        color: var(--tx3);
        font-size: 12.5px;
        cursor: default;
        text-align: center;
        padding: 12px;
      }
      .meta {
        padding: 12px 14px 6px;
      }
      .id {
        display: inline-block;
        font:
          700 11px ui-monospace,
          Consolas,
          monospace;
        background: var(--s2);
        color: var(--tx2);
        border-radius: 6px;
        padding: 2px 7px;
        margin-right: 6px;
      }
      .dk {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--tx3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 1px 6px;
        margin-left: 4px;
        white-space: nowrap;
      }
      .dk.match {
        color: var(--ok);
        border-color: var(--ok);
      }
      .dk.minor {
        color: var(--wn);
        border-color: var(--wn);
      }
      .dk.known,
      .dk.major {
        color: var(--er);
        border-color: var(--er);
      }
      .card h3 {
        font-size: 14.5px;
        margin: 6px 0 2px;
      }
      .card p {
        margin: 0;
        color: var(--tx2);
        font-size: 12.5px;
        min-height: 18px;
      }
      .tr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 0;
      }
      .acts {
        display: flex;
        gap: 6px;
        padding: 10px 14px 12px;
      }
      .acts button {
        flex: 1;
        border: 1px solid var(--bd);
        background: var(--surface);
        color: var(--tx2);
        border-radius: 8px;
        padding: 7px 4px;
        font: 600 12.5px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .acts button:hover {
        background: var(--s2);
      }
      .card[data-s="approved"] .a {
        background: var(--oks);
        color: var(--ok);
        border-color: var(--ok);
      }
      .card[data-s="change"] .c {
        background: var(--wns);
        color: var(--wn);
        border-color: var(--wn);
      }
      .card[data-s="rejected"] .r {
        background: var(--ers);
        color: var(--er);
        border-color: var(--er);
      }
      textarea {
        display: none;
        margin: 0 14px 12px;
        width: calc(100% - 28px);
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        color: var(--tx);
        padding: 8px;
        font: 13px inherit;
        font-family: inherit;
        resize: vertical;
        min-height: 54px;
      }
      .card[data-s="change"] textarea,
      .card[data-s="rejected"] textarea,
      textarea.has {
        display: block;
      }
      .hide {
        display: none !important;
      }
      .miss {
        padding: 0 24px 40px;
      }
      .miss table {
        border-collapse: collapse;
        width: 100%;
        max-width: 1100px;
        font-size: 12.5px;
      }
      .miss td,
      .miss th {
        border-bottom: 1px solid var(--bd);
        padding: 6px 10px;
        text-align: left;
        vertical-align: top;
      }
      .miss th {
        color: var(--tx3);
        font-weight: 600;
      }
      .miss code {
        font:
          700 11px ui-monospace,
          Consolas,
          monospace;
        background: var(--s2);
        border-radius: 5px;
        padding: 1px 6px;
      }
      #lb {
        position: fixed;
        inset: 0;
        background: #000d;
        z-index: 50;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        gap: 12px;
      }
      #lb.on {
        display: flex;
      }
      #lb .imgs {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: center;
        max-width: 98vw;
      }
      #lb img {
        max-width: 96vw;
        max-height: 76vh;
        border-radius: 8px;
        box-shadow: 0 20px 60px #000;
        min-width: 0;
      }
      body.cmp #lb img {
        max-width: 47vw;
      }
      #lb .cap {
        color: #fff;
        text-align: center;
        max-width: 900px;
      }
      #lb .cap b {
        font-size: 16px;
      }
      #lb .cap div {
        opacity: 0.8;
        font-size: 13px;
      }
      #lb .ctl {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #lb .btn {
        background: #ffffff1f;
        color: #fff;
        border-color: #ffffff33;
      }
      @media (max-width: 700px) {
        .card,
        body.cmp .card {
          flex-basis: 88vw;
        }
        .thumbs {
          flex-direction: column;
        }
        .thumb {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <div>
          <h1>SpeakKit built review</h1>
          <div class="sub" id="sub"></div>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="bar" style="padding-top: 0">
        <span class="sub">Screens</span>
        <button class="btn" id="cmp">Compare with design</button>
        <button class="btn" id="copy">Copy summary</button>
        <button class="btn pri" id="export">Export decisions</button>
      </div>
      <nav class="toc" id="toc"></nav>
    </header>
    <main id="main"></main>
    <div id="lb">
      <div class="imgs"><img id="lbd" alt="" class="hide" /><img id="lbimg" alt="" /></div>
      <div class="cap">
        <b id="lbt"></b>
        <div id="lbn"></div>
      </div>
      <div class="ctl">
        <button class="btn" data-k="prev">&larr; Prev</button><button class="btn" data-k="a">Approve</button><button class="btn" data-k="c">Change</button><button class="btn" data-k="r">Reject</button
        ><button class="btn" data-k="d">Compare (D)</button><button class="btn" data-k="next">Next &rarr;</button><button class="btn" data-k="x">Close</button>
      </div>
    </div>
    <script>
      const DATA = {"groups":[{"key":"1","n":1,"name":"Extension popup","blurb":"Toolbar popup states: idle, selection, preparing, playing, paused, pickers, finished, engine asleep and waking, and every problem state."},{"key":"2","n":2,"name":"On-page reading","blurb":"What the content script draws on the page: selection bubble, paragraph gutter, the Lumen read-aloud pill in every state, popovers, toast, back-to-current and the edge launcher."},{"key":"3","n":3,"name":"Reader view","blurb":"The reader overlay in paper and light with the reading panel (font, size, width, theme, highlight sentence)."},{"key":"4","n":4,"name":"Options","blurb":"The extension options page: connection, launcher, voice and speed, highlighting, reader view, shortcuts, sites, and the narrow layout."},{"key":"5","n":5,"name":"Side panel (queue)","blurb":"The side panel: now playing, page outline and the queue."},{"key":"6","n":6,"name":"Desktop setup","blurb":"First-run setup window: welcome, voice engine, download, connect browser, done."},{"key":"7","n":7,"name":"Desktop home and shell","blurb":"The Lumen shell of the desktop app: title bar, sidebar, home, command palette, narrow rail, new reading, notifications."},{"key":"8","n":8,"name":"Desktop library","blurb":"The library: empty, with readings, search results, no results and the delete confirmation."},{"key":"9","n":9,"name":"Desktop reader and export","blurb":"The reader playing and paused, the outline with bookmarks, the voice panel and popover, and the export dialog."},{"key":"10","n":10,"name":"Voices and engines","blurb":"Voices library and the engines pages in their states (ready, unloaded, loading, error)."},{"key":"11","n":11,"name":"Desktop settings","blurb":"Settings pages: general, voice and playback, shortcuts, notifications, memory (ready and unloaded), storage, browser integration, about."},{"key":"12","n":12,"name":"Tray, notifications and system states","blurb":"Mini player, tray panel and quit confirmation. The native tray menu, tray icons and OS toasts cannot be screenshotted (see Not captured)."},{"key":"13","n":13,"name":"Errors and edge states","blurb":"Engine error and engine asleep on the desktop home."}],"cards":[{"key":"A1|idle","id":"A1","state":"idle","title":"Popup · idle on an article","group":"1","groupName":"Extension popup","shots":{"light":"A1-idle-light.png"},"res":{"light":{"pct":8.1,"verdict":"minor","reason":"Idle: Listen, From selection, Reader view and the hint line sit 2 to 5 px lower than the design. Header, now-playing row, scrubber, voice row, shortcuts and footer follow the design within about 2 to 4 px (360 px card). Remaining differences: settings glyph is the vertical sliders icon (design: horizontal), Play / pause shortcut shows Ctrl Shift Y (design: P), buttons in error states carry no leading icon.","design":"A1-idle-light.png"}}},{"key":"A2|selection","id":"A2","state":"selection","title":"Popup · selection ready","group":"1","groupName":"Extension popup","shots":{"light":"A2-selection-light.png"},"res":{"light":{"pct":11.2,"verdict":"minor","reason":"Selection quote and Listen to selection button; same drift as A1.","design":"A2-selection-light.png"}}},{"key":"A3|preparing","id":"A3","state":"preparing","title":"Popup · preparing audio","group":"1","groupName":"Extension popup","shots":{"light":"A3-preparing-light.png"},"res":{"light":{"pct":5.4,"verdict":"minor","reason":"Preparing bar and Cancel match; spacing differs by 2 to 4 px.","design":"A3-preparing-light.png"}}},{"key":"A4|playing","id":"A4","state":"playing","title":"Popup · playing","group":"1","groupName":"Extension popup","shots":{"light":"A4-playing-light.png"},"res":{"light":{"pct":5.26,"verdict":"minor","reason":"Playing: transport (52 px play, 28 px skips) and times within 2 px after the fix; skip glyphs are slightly smaller than the design. Header, now-playing row, scrubber, voice row, shortcuts and footer follow the design within about 2 to 4 px (360 px card). Remaining differences: settings glyph is the vertical sliders icon (design: horizontal), Play / pause shortcut shows Ctrl Shift Y (design: P), buttons in error states carry no leading icon.","design":"A4-playing-light.png"}}},{"key":"A5|paused","id":"A5","state":"paused","title":"Popup · paused","group":"1","groupName":"Extension popup","shots":{"light":"A5-paused-light.png"},"res":{"light":{"pct":5.27,"verdict":"minor","reason":"Paused: same as A4.","design":"A5-paused-light.png"}}},{"key":"A6|voice-picker","id":"A6","state":"voice-picker","title":"Popup · voice picker","group":"1","groupName":"Extension popup","shots":{"light":"A6-voice-picker-light.png"},"res":{"light":{"pct":6.59,"verdict":"major","reason":"Voice picker: product has an extra Voice filter chip and a filled accent row for the selected voice, the scrubber row is not compacted, the list shows 5 rows (design 4 with scrollbar).","design":"A6-voice-picker-light.png"}}},{"key":"A7|speed-picker","id":"A7","state":"speed-picker","title":"Popup · speed picker","group":"1","groupName":"Extension popup","shots":{"light":"A7-speed-picker-light.png"},"res":{"light":{"pct":5.52,"verdict":"minor","reason":"Speed picker: presets and slider match in structure (not viewed side by side).","design":"A7-speed-picker-light.png"}}},{"key":"A8|finished","id":"A8","state":"finished","title":"Popup · finished","group":"1","groupName":"Extension popup","shots":{"light":"A8-finished-light.png"},"res":{"light":{"pct":6.6,"verdict":"minor","reason":"Finished: replay button and Up next card match in structure; the Up next title truncates in the product (design wraps), voice row sits 20 px lower.","design":"A8-finished-light.png"}}},{"key":"A9|app-not-running","id":"A9","state":"app-not-running","title":"Popup · app not running","group":"1","groupName":"Extension popup","shots":{"light":"A9-app-not-running-light.png"},"res":{"light":{"pct":8.68,"verdict":"minor","reason":"Offline: icon tile, title and body match; the two buttons have no leading icons.","design":"A9-app-not-running-light.png"}}},{"key":"A10|model-loading","id":"A10","state":"model-loading","title":"Popup · model loading","group":"1","groupName":"Extension popup","shots":{"light":"A10-model-loading-light.png"},"res":{"light":{"pct":5.4,"verdict":"minor","reason":"Loading bar and wording (not viewed side by side).","design":"A10-model-loading-light.png"}}},{"key":"A11|page-unreadable","id":"A11","state":"page-unreadable","title":"Popup · page not readable","group":"1","groupName":"Extension popup","shots":{"light":"A11-page-unreadable-light.png"},"res":{"light":{"pct":6.93,"verdict":"minor","reason":"Cannot read this page: tile has no amber tint and the button has no leading clipboard icon; text and layout match.","design":"A11-page-unreadable-light.png"}}},{"key":"A13|not-installed","id":"A13","state":"not-installed","title":"Popup · app not installed","group":"1","groupName":"Extension popup","shots":{"light":"A13-not-installed-light.png"},"res":{"light":{"pct":8.42,"verdict":"minor","reason":"Not installed: same layout as A9 (not viewed side by side).","design":"A13-not-installed-light.png"}}},{"key":"A14|token-rejected","id":"A14","state":"token-rejected","title":"Popup · pairing token rejected","group":"1","groupName":"Extension popup","shots":{"light":"A14-token-rejected-light.png"},"res":{"light":{"pct":8.93,"verdict":"minor","reason":"Token rejected: same layout as A9 (not viewed side by side).","design":"A14-token-rejected-light.png"}}},{"key":"A15|file-permission","id":"A15","state":"file-permission","title":"Popup · local file needs permission","group":"1","groupName":"Extension popup","shots":{"light":"A15-file-permission-light.png"},"res":{"light":{"pct":6.73,"verdict":"minor","reason":"File permission: same layout as A9 (not viewed side by side).","design":"A15-file-permission-light.png"}}},{"key":"A24|tab-hidden","id":"A24","state":"tab-hidden","title":"Popup · page controls closed in this tab, Show on this page","group":"1" on":"Foundations board: tokens, icons and component sheets, not a product screen (tokens and components are verified through the kit gallery in packages/ui)."},{"id":"MO1","title":"Motion tokens (Motion)","reason":"Motion board: motion tokens and rules, not a product screen."},{"id":"MO2","title":"Per-element rules (Motion)","reason":"Motion board: motion tokens and rules, not a product screen."},{"id":"MO3","title":"Reduce motion and principles (Motion)","reason":"Motion board: motion tokens and rules, not a product screen."}],"counts":{"shots":175,"cards":175,"frames":236,"missing":119}};
      const KEY = "built-review-v1";
      let state = {};
      try {
        state = JSON.parse(localStorage.getItem(KEY) || "{}");
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
        } catch (e) {}
      };
      const pref = (k, d) => {
        try {
          return localStorage.getItem(KEY + "-" + k) || d;
        } catch (e) {
          return d;
        }
      };
      const setPref = (k, v) => {
        try {
          localStorage.setItem(KEY + "-" + k, v);
        } catch (e) {}
      };
      const C = DATA.cards,
        G = DATA.groups;
      const byGroup = {};
      C.forEach((c) => (byGroup[c.group] ??= []).push(c));
      const groups = G.filter((g) => byGroup[g.key]);
      let filter = "all",
        cmp = pref("cmp", "0") === "1";
      const get = (k) => state[k] || { s: "pending", n: "" };
      const set = (k, p) => {
        state[k] = { ...get(k), ...p };
        save();
      };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const label = (r) =>
        r
          ? { match: "match", minor: "minor drift", known: "known difference", major: "drifts", only: "product only", twin: "no light twin" }[r.verdict] + (r.pct != null ? " " + r.pct + "%" : "")
          : "";
      function thumbs(c) {
        const t = "light",
          r = c.res[t];
        const built = '<div class="thumb" data-zoom="' + c.key + '"><i>BUILT · ' + t.toUpperCase() + '</i><img loading="lazy" src="shots/' + c.shots[t] + '" alt="' + esc(c.title) + '"></div>';
        if (!cmp) return built;
        const d =
          r && r.design
            ? '<div class="thumb" data-zoom="' + c.key + '"><i>DESIGN</i><img loading="lazy" src="design/' + r.design + '" alt=""></div>'
            : '<div class="thumb none">No design frame for this screen</div>';
        return d + built;
      }
      function render() {
        const main = document.getElementById("main");
        main.innerHTML = "";
        document.body.classList.toggle("cmp", cmp);
        groups.forEach((g) => {
          const sec = document.createElement("section");
          sec.className = "feat";
          sec.id = "g-" + g.key;
          const list = byGroup[g.key];
          sec.innerHTML =
            '<div class="fh"><div class="k">' +
            g.n +
            '</div><div class="grow"><h2>' +
            esc(g.name) +
            "</h2><p>" +
            esc(g.blurb) +
            ' <span class="sub">' +
            list.length +
            ' screens</span></p></div><button class="btn" data-all="' +
            g.key +
            '">Approve all</button></div><div class="row"></div>';
          const row = sec.querySelector(".row");
          list.forEach((c) => {
            const st = get(c.key),
              t = "light",
              r = c.res[t];
            const el = document.createElement("article");
            el.className = "card";
            el.dataset.s = st.s;
            el.dataset.key = c.key;
            if (filter !== "all" && st.s !== filter) el.classList.add("hide");
            el.innerHTML =
              '<div class="thumbs">' +
              thumbs(c) +
              '</div><div class="meta"><span class="id">' +
              c.id +
              '</span><span class="dk">' +
              esc(c.state) +
              "</span>" +
              (r ? '<span class="dk ' + r.verdict + '">' + label(r) + "</span>" : '<span class="dk">no design to diff</span>') +
              "<h3>" +
              esc(c.title) +
              "</h3><p>" +
              esc(r && r.reason ? r.reason : "") +
              "</p></div>" +
              '<div class="acts"><button class="a" data-set="approved">&#10003; Approve</button><button class="c" data-set="change">&#9998; Change</button><button class="r" data-set="rejected">&#10005; Reject</button></div><textarea placeholder="What should change?" class="' +
              (st.n ? "has" : "") +
              '">' +
              esc(st.n) +
              "</textarea>";
            row.appendChild(el);
          });
          main.appendChild(sec);
        });
        const miss = document.createElement("section");
        miss.className = "feat miss";
        miss.id = "g-missing";
        miss.innerHTML =
          '<div class="fh"><div class="k">!</div><div class="grow"><h2>Not captured</h2><p>Design screens that could not be captured from the built product, with the reason. ' +
          DATA.missing.length +
          ' frames.</p></div></div><div style="padding:14px 0"><table><tr><th>Id</th><th>Design screen</th><th>Reason</th></tr>' +
          DATA.missing.map((m) => "<tr><td><code>" + esc(m.id) + "</code></td><td>" + esc(m.title) + "</td><td>" + esc(m.reason) + "</td></tr>").join("") +
          "</table></div>";
        main.appendChild(miss);
        stats();
      }
      function stats() {
        const n = { pending: 0, approved: 0, change: 0, rejected: 0 };
        C.forEach((c) => n[get(c.key).s]++);
        const mk = (f, l, v) => '<button class="pill ' + (filter === f ? "on" : "") + '" data-f="' + f + '">' + l + " <b>" + v + "</b></button>";
        document.getElementById("stats").innerHTML =
          mk("all", "All", C.length) + mk("pending", "Pending", n.pending) + mk("approved", "Approved", n.approved) + mk("change", "Needs changes", n.change) + mk("rejected", "Rejected", n.rejected);
        document.getElementById("toc").innerHTML =
          groups
            .map((g) => '<a href="#g-' + g.key + '">' + esc(g.name) + "<span>" + byGroup[g.key].filter((c) => get(c.key).s === "approved").length + "/" + byGroup[g.key].length + "</span></a>")
            .join("") +
          '<a href="#g-missing">Not captured<span>' +
          DATA.missing.length +
          "</span></a>";
        document.getElementById("sub").textContent =
          C.length +
          " screens captured from the built product (" +
          DATA.counts.shots +
          " images, light) · " +
          groups.length +
          " features · click an image to enlarge · viewer keys: ← → move, A approve, C change, R reject, D compare";
        document.getElementById("cmp").classList.toggle("on", cmp);
      }
      function apply(key, s) {
        set(key, { s });
        const el = document.querySelector('.card[data-key="' + key + '"]');
        if (el) {
          el.dataset.s = s;
          if (filter !== "all" && s !== filter) el.classList.add("hide");
        }
        stats();
        if (lbIdx >= 0) lbShow();
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-set],[data-zoom],[data-f],[data-all],#cmp,[data-ct] button");
        if (!t) return;
        if (t.dataset.set) {
          const k = t.closest(".card").dataset.key;
          apply(k, get(k).s === t.dataset.set ? "pending" : t.dataset.set);
        } else if (t.dataset.zoom) {
          lbIdx = C.findIndex((c) => c.key === t.dataset.zoom);
          lbShow();
        } else if (t.dataset.f) {
          filter = t.dataset.f;
          render();
        } else if (t.dataset.all) {
          byGroup[t.dataset.all].forEach((c) => set(c.key, { s: "approved" }));
          render();
        } else if (t.id === "cmp") {
          cmp = !cmp;
          setPref("cmp", cmp ? "1" : "0");
          render();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.tagName === "TEXTAREA") set(e.target.closest(".card").dataset.key, { n: e.target.value });
      });
      let lbIdx = -1;
      const lb = document.getElementById("lb");
      function lbShow() {
        const c = C[lbIdx];
        if (!c) return;
        lb.classList.add("on");
        const t = "light",
          r = c.res[t];
        document.getElementById("lbimg").src = "shots/" + c.shots[t];
        const d = document.getElementById("lbd");
        d.classList.toggle("hide", !(cmp && r && r.design));
        if (cmp && r && r.design) d.src = "design/" + r.design;
        document.getElementById("lbt").textContent = c.id + " · " + c.title + " · " + t;
        document.getElementById("lbn").textContent = (r ? label(r) + ". " + (r.reason || "") : "No design to diff.") + "   [" + get(c.key).s + "]";
      }
      const lbMove = (d) => {
        lbIdx = (lbIdx + d + C.length) % C.length;
        lbShow();
      };
      const lbClose = () => {
        lbIdx = -1;
        lb.classList.remove("on");
      };
      lb.addEventListener("click", (e) => {
        const k = e.target.dataset.k;
        if (!k) {
          if (e.target === lb) lbClose();
          return;
        }
        if (k === "x") lbClose();
        else if (k === "prev") lbMove(-1);
        else if (k === "next") lbMove(1);
        else if (k === "d") {
          cmp = !cmp;
          setPref("cmp", cmp ? "1" : "0");
          render();
          lbShow();
        } else apply(C[lbIdx].key, { a: "approved", c: "change", r: "rejected" }[k]);
      });
      document.addEventListener("keydown", (e) => {
        if (lbIdx < 0 || e.target.tagName === "TEXTAREA") return;
        const k = e.key.toLowerCase();
        if (e.key === "ArrowRight") lbMove(1);
        else if (e.key === "ArrowLeft") lbMove(-1);
        else if (e.key === "Escape") lbClose();
        else if (k === "d") {
          cmp = !cmp;
          setPref("cmp", cmp ? "1" : "0");
          render();
          lbShow();
        } else if ("acr".includes(k)) apply(C[lbIdx].key, { a: "approved", c: "change", r: "rejected" }[k]);
      });
      const decisions = () =>
        C.map((c) => ({
          id: c.id,
          state: c.state,
          feature: c.groupName,
          title: c.title,
          status: get(c.key).s,
          comment: get(c.key).n,
          diff: { light: c.res.light && c.res.light.pct },
        }));
      document.getElementById("export").onclick = () => {
        const b = new Blob([JSON.stringify(decisions(), null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "built-review-decisions.json";
        a.click();
      };
      document.getElementById("copy").onclick = async () => {
        const d = decisions();
        const L = [];
        groups.forEach((g) => {
          const x = d.filter((r) => r.feature === g.name && r.status !== "approved" && r.status !== "pending");
          if (x.length) {
            L.push("## " + g.name);
            x.forEach((r) => L.push("- " + r.id + " " + r.state + " " + r.title + " — " + r.status + (r.comment ? ": " + r.comment : "")));
          }
        });
        const txt = L.join("\n") || "No change or reject notes yet.";
        try {
          await navigator.clipboard.writeText(txt);
        } catch (e) {
          prompt("Copy:", txt);
        }
        document.getElementById("copy").textContent = "Copied";
        setTimeout(() => (document.getElementById("copy").textContent = "Copy summary"), 1200);
      };
      render();
    </script>
