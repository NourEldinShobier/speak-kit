packages:
  - packages/*
  - apps/*
  - e2e
  - tools/*
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  tesseract.js: false

# Exact pins live here only; package.json files say "catalog:". A release must be 7 days old (minutes).
minimumReleaseAge: 10080
# Versions in the lockfile that were younger than 7 days when it was first pinned (2026-11-01); delete the entry once the version is a week old.
